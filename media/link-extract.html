<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链接直链提取 - 视听专区</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --primary: #3b82f6;
            --secondary: #8b5cf6;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --radius: 16px;
            --ok: #34d399;
            --warn: #fbbf24;
            --err: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 72px 20px 60px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        header { text-align: center; }

        .logo-title {
            font-family: 'Outfit', sans-serif;
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { color: var(--text-muted); font-size: 16px; }

        .float-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .float-back:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 24px;
        }

        .input-group { display: flex; gap: 12px; width: 100%; }

        .styled-input {
            flex: 1;
            min-width: 0;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .styled-input:focus { border-color: var(--primary); }
        .styled-input::placeholder { color: #71717a; }

        .action-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        .action-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); }
        .action-btn:active:not(:disabled) { transform: translateY(0); }
        .action-btn:disabled { opacity: 0.55; cursor: not-allowed; }

        /* 状态条 */
        .status {
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            word-break: break-all;
        }
        .status.show { display: flex; }
        .status.info { background: rgba(59,130,246,0.12); color: #bfdbfe; }
        .status.ok   { background: rgba(52,211,153,0.12); color: #a7f3d0; }
        .status.err  { background: rgba(248,113,113,0.12); color: #fecaca; }

        .spinner {
            width: 16px; height: 16px; flex: none;
            border: 2px solid rgba(255,255,255,0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 结果区 */
        .result-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .result-head h2 { font-family: 'Outfit', sans-serif; font-size: 20px; }
        .result-meta { color: var(--text-muted); font-size: 13px; }

        .copy-all {
            background: rgba(139, 92, 246, 0.18);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: #ddd6fe;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-all:hover { background: rgba(139, 92, 246, 0.32); }

        .link-list { display: flex; flex-direction: column; gap: 12px; }

        .link-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.32);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 14px 16px;
            flex-wrap: wrap;
        }

        .badge {
            flex: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 5px 10px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .badge.stream   { background: rgba(139,92,246,0.2); color: #c4b5fd; }
        .badge.video    { background: rgba(59,130,246,0.2); color: #93c5fd; }
        .badge.audio    { background: rgba(20,184,166,0.2); color: #5eead4; }
        .badge.archive  { background: rgba(251,191,36,0.2); color: #fde68a; }
        .badge.doc      { background: rgba(248,113,113,0.2); color: #fecaca; }
        .badge.other    { background: rgba(161,161,170,0.2); color: #d4d4d8; }

        .link-url {
            flex: 1;
            min-width: 180px;
            font-size: 13px;
            color: #e5e7eb;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            word-break: break-all;
            line-height: 1.5;
        }
        .link-ext { flex: none; color: var(--text-muted); font-size: 12px; }

        .item-actions { display: flex; gap: 8px; flex: none; }
        .mini-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            color: #e5e7eb;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .mini-btn:hover { background: rgba(255,255,255,0.16); color: white; }

        .tips {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid var(--primary);
            padding: 16px 18px;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: #d1d5db;
            line-height: 1.8;
        }
        .tips strong { color: #fff; }
        .tips .muted { color: var(--text-muted); }

        @media (max-width: 600px) {
            .input-group { flex-direction: column; }
            .logo-title { font-size: 36px; }
            .container { gap: 20px; }
        }
    </style>
</head>
<body>
    <a href="../media.html" class="float-back">返回视听专区</a>

    <div class="container">
        <header>
            <h1 class="logo-title">链接直链提取</h1>
            <p class="subtitle">粘贴网页或文件链接，自动找出其中的可下载地址</p>
        </header>

        <div class="panel">
            <div class="input-group">
                <input type="url" id="url-input" class="styled-input"
                       placeholder="在此粘贴链接，例如：https://example.com/video-page 或 ...file.mp4" />
                <button id="extract-btn" class="action-btn">提取直链</button>
            </div>
        </div>

        <div id="status" class="status"></div>

        <div id="result-panel" class="panel" style="display:none;">
            <div class="result-head">
                <div>
                    <h2 id="result-title">提取结果</h2>
                    <div id="result-meta" class="result-meta"></div>
                </div>
                <button id="copy-all" class="copy-all">复制全部直链</button>
            </div>
            <div id="link-list" class="link-list"></div>
        </div>

        <div class="tips">
            <strong>使用说明</strong><br>
            1. 粘贴一个网页地址，工具会扫描页面里的 mp4 / m3u8 / mp3 等媒体直链并列出。<br>
            2. 如果粘贴的本身就是文件直链（以 .mp4、.mp3、.zip 等结尾），会直接返回该地址。<br>
            3. 点「复制」拿到地址后，可用浏览器新窗口打开另存，或交给你习惯的下载器。<br>
            4. 点「打开」可在新标签页访问该地址（部分站点会直接播放而非下载）。<br>
            <span class="muted">说明：仅提取公开可见或你本人有权访问的地址，不绕过付费墙、登录或 DRM；由脚本动态生成或需要登录才出现的地址可能无法提取。</span>
        </div>
    </div>

    <script>
        const urlInput   = document.getElementById('url-input');
        const extractBtn = document.getElementById('extract-btn');
        const statusEl   = document.getElementById('status');
        const resultPanel= document.getElementById('result-panel');
        const resultTitle= document.getElementById('result-title');
        const resultMeta = document.getElementById('result-meta');
        const linkList   = document.getElementById('link-list');
        const copyAllBtn = document.getElementById('copy-all');

        let currentLinks = [];

        function setStatus(kind, text, loading) {
            statusEl.className = 'status show ' + kind;
            statusEl.textContent = '';
            if (loading) {
                const sp = document.createElement('span');
                sp.className = 'spinner';
                statusEl.appendChild(sp);
            }
            const t = document.createElement('span');
            t.textContent = text;
            statusEl.appendChild(t);
        }
        function hideStatus() { statusEl.className = 'status'; statusEl.textContent = ''; }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
                document.body.removeChild(ta);
                return ok;
            }
        }

        function renderResults(data) {
            currentLinks = data.links || [];
            linkList.textContent = '';

            if (!currentLinks.length) {
                resultPanel.style.display = 'block';
                resultTitle.textContent = '没有找到直链';
                resultMeta.textContent = data.message || '';
                copyAllBtn.style.display = 'none';
                return;
            }

            resultPanel.style.display = 'block';
            copyAllBtn.style.display = '';
            resultTitle.textContent = data.type === 'direct' ? '文件直链' : '提取结果';
            resultMeta.textContent = (data.message || '') + '  ·  来源：' + (data.finalUrl || data.source);

            const labelMap = { stream: 'm3u8', video: '视频', audio: '音频', archive: '文件', doc: '文档', other: '链接' };

            currentLinks.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'link-item';

                const badge = document.createElement('span');
                badge.className = 'badge ' + (item.kind || 'other');
                badge.textContent = labelMap[item.kind] || (item.ext || item.kind || '链接');
                row.appendChild(badge);

                const url = document.createElement('span');
                url.className = 'link-url';
                url.textContent = item.url;
                row.appendChild(url);

                if (item.ext) {
                    const ext = document.createElement('span');
                    ext.className = 'link-ext';
                    ext.textContent = '.' + item.ext;
                    row.appendChild(ext);
                }

                const actions = document.createElement('div');
                actions.className = 'item-actions';

                const copyBtn = document.createElement('button');
                copyBtn.className = 'mini-btn';
                copyBtn.textContent = '复制';
                copyBtn.addEventListener('click', async () => {
                    const ok = await copyText(item.url);
                    copyBtn.textContent = ok ? '已复制' : '复制失败';
                    setTimeout(() => { copyBtn.textContent = '复制'; }, 1600);
                });
                actions.appendChild(copyBtn);

                const openBtn = document.createElement('a');
                openBtn.className = 'mini-btn';
                openBtn.textContent = '打开';
                openBtn.href = item.url;
                openBtn.target = '_blank';
                openBtn.rel = 'noopener noreferrer';
                actions.appendChild(openBtn);

                row.appendChild(actions);
                linkList.appendChild(row);
            });
        }

        async function doExtract() {
            const raw = urlInput.value.trim();
            if (!raw) {
                setStatus('err', '请先粘贴一个链接');
                urlInput.focus();
                return;
            }
            let target = raw;
            if (!/^https?:\/\//i.test(target)) target = 'https://' + target;

            resultPanel.style.display = 'none';
            currentLinks = [];
            extractBtn.disabled = true;
            extractBtn.textContent = '提取中…';
            setStatus('info', '正在抓取并分析页面，请稍候…', true);

            try {
                const res = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: target }),
                });
                const data = await res.json();
                if (!res.ok || data.ok === false) {
                    setStatus('err', data.error || ('提取失败（HTTP ' + res.status + '）'));
                    return;
                }
                hideStatus();
                renderResults(data);
            } catch (err) {
                setStatus('err', '请求失败：' + (err?.message || err));
            } finally {
                extractBtn.disabled = false;
                extractBtn.textContent = '提取直链';
            }
        }

        extractBtn.addEventListener('click', doExtract);
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doExtract();
        });
        copyAllBtn.addEventListener('click', async () => {
            if (!currentLinks.length) return;
            const text = currentLinks.map(x => x.url).join('\n');
            const ok = await copyText(text);
            copyAllBtn.textContent = ok ? '已复制全部' : '复制失败';
            setTimeout(() => { copyAllBtn.textContent = '复制全部直链'; }, 1600);
        });
    </script>
</body>
</html>
