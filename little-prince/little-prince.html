 to pretend that I was nursing her back to life-- for if I did not do that, to humble myself also, she would really allow herself to die...\"", "Then he went on with his reflections: \"I thought that I was rich, with a flower that was unique in all the world; and all I had was a common rose. A common rose, and three volcanoes that come up to my knees-- and one of them perhaps extinct forever... that doesn‘t make me a very great prince...\"", "And he lay down in the grass and cried."]}, {"num": 21, "title": "商人卖止渴药丸", "paras": ["It was then that the fox appeared.", "\"Good morning,\" said the fox.", "\"Good morning,\" the little prince responded politely, although when he turned around he saw nothing.", "\"I am right here,\" the voice said, \"under the apple tree.\"", "\"Who are you?\" asked the little prince, and added, \"You are very pretty to look at.\"", "\"I am a fox,\" said the fox.", "\"Come and play with me,\" proposed the little prince. \"I am so unhappy.\"", "\"I cannot play with you,\" the fox said. \"I am not tamed.\"", "\"Ah! Please excuse me,\" said the little prince.", "But, after some thought, he added: \"What does that mean-- ‘tame‘?\"", "\"You do not live here,\" said the fox. \"What is it that you are looking for?\"", "\"I am looking for men,\" said the little prince. \"What does that mean-- ‘tame‘?\"", "\"Men,\" said the fox. \"They have guns, and they hunt. It is very disturbing. They also raise chickens. These are their only interests. Are you looking for chickens?\"", "\"No,\" said the little prince. \"I am looking for friends. What does that mean-- ‘tame‘?\"", "\"It is an act too often neglected,\" said the fox. It means to establish ties.\"", "\"‘To establish ties‘?\"", "\"Just that,\" said the fox. \"To me, you are still nothing more than a little boy who is just like a hundred thousand other little boys. And I have no need of you. And you, on your part, have no need of me. To you, I am nothing more than a fox like a hundred thousand other foxes. But if you tame me, then we shall need each other. To me, you will be unique in all the world. To you, I shall be unique in all the world...\"", "\"I am beginning to understand,\" said the little prince. \"There is a flower... I think that she has tamed me...\"", "\"It is possible,\" said the fox. \"On the Earth one sees all sorts of things.\"", "\"Oh, but this is not on the Earth!\" said the little prince.", "The fox seemed perplexed, and very curious.", "\"On another planet?\"", "\"Yes.\"", "\"Are there hunters on this planet?\"", "\"No.\"", "\"Ah, that is interesting! Are there chickens?\"", "\"No.\"", "\"Nothing is perfect,\" sighed the fox.", "But he came back to his idea.", "\"My life is very monotonous,\" the fox said. \"I hunt chickens; men hunt me. All the chickens are just alike, and all the men are just alike. And, in consequence, I am a little bored. But if you tame me, it will be as if the sun came to shine on my life . I shall know the sound of a step that will be different from all the others. Other steps send me hurrying back underneath the ground. Yours will call me, like music, out of my burrow. And then look: you see the grain-fields down yonder? I do not ea t bread. Wheat is of no use to me. The wheat fields have nothing to say to me. And that is sad. But you have hair that is the colour of gold. Think how wonderful that will be when you have tamed me! The grain, which is also golden, will bring me bac k the thought of you. And I shall love to listen to the wind in the wheat...\"", "The fox gazed at the little prince, for a long time.", "\"Please-- tame me!\" he said.", "\"I want to, very much,\" the little prince replied. \"But I have not much time. I have friends to discover, and a great many things to understand.\"", "\"One only understands the things that one tames,\" said the fox. \"Men have no more time to understand anything. They buy things all ready made at the shops. But there is no shop anywhere where one can buy friendship, and so men have no friends any more. If you want a friend, tame me...\"", "\"What must I do, to tame you?\" asked the little prince.", "\"You must be very patient,\" replied the fox. \"First you will sit down at a little distance from me-- like that-- in the grass. I shall look at you out of the corner of my eye, and you will say nothing. Words are the source of misunderstandings. But yo u will sit a little closer to me, every day...\"", "The next day the little prince came back.", "\"It would have been better to come back at the same hour,\" said the fox. \"If, for example, you come at four o‘clock in the afternoon, then at three o‘clock I shall begin to be happy. I shall feel happier and happier as the hour advances. At four o‘clock, I shall already be worrying and jumping about. I shall show you how happy I am! But if you come at just any time, I shall never know at what hour my heart is to be ready to greet you... One must observe the proper rites...\"", "\"What is a rite?\" asked the little prince.", "\"Those also are actions too often neglected,\" said the fox. \"They are what make one day different from other days, one hour from other hours. There is a rite, for example, among my hunters. Every Thursday they dance with the village girls. So Thursday is a wonderful day for me! I can take a walk as far as the vineyards. But if the hunters danced at just any time, every day would be like every other day, and I should never have any vacation at all.\"", "So the little prince tamed the fox. And when the hour of his departure drew near--", "\"Ah,\" said the fox, \"I shall cry.\"", "\"It is your own fault,\" said the little prince. \"I never wished you any sort of harm; but you wanted me to tame you...\"", "\"Yes, that is so,\" said the fox.", "\"But now you are going to cry!\" said the little prince.", "\"Yes, that is so,\" said the fox.", "\"Then it has done you no good at all!\"", "\"It has done me good,\" said the fox, \"because of the color of the wheat fields.\" And then he added:", "\"Go and look again at the roses. You will understand now that yours is unique in all the world. Then come back to say goodbye to me, and I will make you a present of a secret.\"", "The little prince went away, to look again at the roses.", "\"You are not at all like my rose,\" he said. \"As yet you are nothing. No one has tamed you, and you have tamed no one. You are like my fox when I first knew him. He was only a fox like a hundred thousand other foxes. But I have made him my friend, and now he is unique in all the world.\"", "And the roses were very much embarrassed.", "\"You are beautiful, but you are empty,\" he went on. \"One could not die for you. To be sure, an ordinary passerby would think that my rose looked just like you-- the rose that belongs to me. But in herself alone she is more important than all the hundreds of you other roses: because it is she that I have watered; because it is she that I have put under the glass globe; because it is she that I have sheltered behind the screen; because it is for her that I have killed the caterpillars (except the two or three that we saved to become butterflies); because it is she that I have listened to, when she grumbled, or boasted, or even sometimes when she said nothing. Because she is my rose.", "And he went back to meet the fox.", "\"Goodbye,\" he said.", "\"Goodbye,\" said the fox. \"And now here is my secret, a very simple secret: It is only with the heart that one can see rightly; what is essential is invisible to the eye.\"", "\"What is essential is invisible to the eye,\" the little prince repeated, so that he would be sure to remember.", "\"It is the time you have wasted for your rose that makes your rose so important.\"", "\"It is the time I have wasted for my rose--\" said the little prince, so that he would be sure to remember.", "\"Men have forgotten this truth,\" said the fox. \"But you must not forget it. You become responsible, forever, for what you have tamed. You are responsible for your rose...\"", "\"I am responsible for my rose,\" the little prince repeated, so that he would be sure to remember."]}, {"num": 22, "title": "小王子的离别", "paras": ["\"Good morning,\" said the little prince.", "\"Good morning,\" said the railway switchman.", "\"What do you do here?\" the little prince asked.", "\"I sort out travelers, in bundles of a thousand,\" said the switchman. \"I send off the trains that carry them; now to the right, now to the left.\"", "And a brilliantly lighted express train shook the switchman‘s cabin as it rushed by with a roar like thunder.", "\"They are in a great hurry,\" said the little prince. \"What are they looking for?\"", "\"Not even the locomotive engineer knows that,\" said the switchman.", "And a second brilliantly lighted express thundered by, in the opposite direction.", "\"Are they coming back already?\" demanded the little prince.", "\"These are not the same ones,\" said the switchman. \"It is an exchange.\"", "\"Were they not satisfied where they were?\" asked the little prince.", "\"No one is ever satisfied where he is,\" said the switchman.", "And they heard the roaring thunder of a third brilliantly lighted express.", "\"Are they pursuing the first travelers?\" demanded the little prince.", "\"They are pursuing nothing at all,\" said the switchman. \"They are asleep in there, or if they are not asleep they are yawning. Only the children are flattening their noses against the windowpanes.\"", "\"Only the children know what they are looking for,\" said the little prince. \"They waste their time over a rag doll and it becomes very important to them; and if anybody takes it away from them, they cry...\"", "\"They are lucky,\" the switchman said."]}, {"num": 23, "title": "毒蛇的承诺", "paras": ["\"Good morning,\" said the little prince.", "\"Good morning,\" said the merchant.", "This was a merchant who sold pills that had been invented to quench thirst. You need only swallow one pill a week, and you would feel no need of anything to drink.", "\"Why are you selling those?\" asked the little prince.", "\"Because they save a tremendous amount of time,\" said the merchant. \"Computations have been made by experts. With these pills, you save fifty-three minutes in every week.\"", "\"And what do I do with those fifty-three minutes?\"", "\"Anything you like...\"", "\"As for me,\" said the little prince to himself, \"if I had fifty-three minutes to spend as I liked, I should walk at my leisure toward a spring of fresh water.\""]}, {"num": 24, "title": "与飞行员告别", "paras": ["It was now the eighth day since I had had my accident in the desert, and I had listened to the story of the merchant as I was drinking the last drop of my water supply.", "\"Ah,\" I said to the little prince, \"these memories of yours are very charming; but I have not yet succeeded in repairing my plane; I have nothing more to drink; and I, too, should be very happy if I could walk at my leisure toward a spring of fresh water!\"", "\"My friend the fox--\" the little prince said to me.", "\"My dear little man, this is no longer a matter that has anything to do with the fox!\"", "\"Why not?\"", "\"Because I am about to die of thirst...\"", "He did not follow my reasoning, and he answered me:", "\"It is a good thing to have had a friend, even if one is about to die. I, for instance, am very glad to have had a fox as a friend...\"", "\"He has no way of guessing the danger,\" I said to myself. \"He has never been either hungry or thirsty. A little sunshine is all he needs...\"", "But he looked at me steadily, and replied to my thought:", "\"I am thirsty, too. Let us look for a well...\"", "I made a gesture of weariness. It is absurd to look for a well, at random, in the immensity of the desert. But nevertheless we started walking.", "When we had trudged along for several hours, in silence, the darkness fell, and the stars began to come out. Thirst had made me a little feverish, and I looked at them as if I were in a dream. The little prince‘s last words came reeling back into my memory:", "\"Then you are thirsty, too?\" I demanded.", "But he did not reply to my question. He merely said to me:", "\"Water may also be good for the heart...\"", "I did not understand this answer, but I said nothing. I knew very well that it was impossible to cross-examine him.", "He was tired. He sat down. I sat down beside him. And, after a little silence, he spoke again:", "\"The stars are beautiful, because of a flower that cannot be seen.\"", "I replied, \"Yes, that is so.\" And, without saying anything more, I looked across the ridges of sand that were stretched out before us in the moonlight.", "\"The desert is beautiful,\" the little prince added.", "And that was true. I have always loved the desert. One sits down on a desert sand dune, sees nothing, hears nothing. Yet through the silence something throbs, and gleams...", "\"What makes the desert beautiful,\" said the little prince, \"is that somewhere it hides a well...\"", "I was astonished by a sudden understanding of that mysterious radiation of the sands. When I was a little boy I lived in an old house, and legend told us that a treasure was buried there. To be sure, no one had ever known how to find it; perhaps no one had ever even looked for it. But it cast an enchantment over that house. My home was hiding a secret in the depths of its heart...", "\"Yes,\" I said to the little prince. \"The house, the stars, the desert-- what gives them their beauty is something that is invisible!\"", "\"I am glad,\" he said, \"that you agree with my fox.\"", "As the little prince dropped off to sleep, I took him in my arms and set out walking once more. I felt deeply moved, and stirred. It seemed to me that I was carrying a very fragile treasure. It seemed to me, even, that there was nothing more fragile on all Earth. In the moonlight I looked at his pale forehead, his closed eyes, his locks of hair that trembled in the wind, and I said to myself: \"What I see here is nothing but a shell. What is most important is invisible...\"", "As his lips opened slightly with the suspicious of a half-smile, I said to myself, again: \"What moves me so deeply, about this little prince who is sleeping here, is his loyalty to a flower-- the image of a rose that shines through his whole being like the flame of a lamp, even when he is asleep...\" And I felt him to be more fragile still. I felt the need of protecting him, as if he himself were a flame that might be extinguished by a little puff of wind...", "And, as I walked on so, I found the well, at daybreak."]}, {"num": 25, "title": "星光与笑声", "paras": ["\"Men,\" said the little prince, \"set out on their way in express trains, but they do not know what they are looking for. Then they rush about, and get excited, and turn round and round...\"", "And he added:", "\"It is not worth the trouble...\"", "The well that we had come to was not like the wells of the Sahara. The wells of the Sahara are mere holes dug in the sand. This one was like a well in a village. But there was no village here, and I thought I must be dreaming...", "\"It is strange,\" I said to the little prince. \"Everything is ready for use: the pulley, the bucket, the rope...\"", "He laughed, touched the rope, and set the pulley to working. And the pulley moaned, like an old weathervane which the wind has long since forgotten.", "\"Do you hear?\" said the little prince. \"We have wakened the well, and it is singing...\"", "I did not want him to tire himself with the rope.", "\"Leave it to me,\" I said. \"It is too heavy for you.\"", "I hoisted the bucket slowly to the edge of the well and set it there-- happy, tired as I was, over my achievement. The song of the pulley was still in my ears, and I could see the sunlight shimmer in the still trembling water.", "\"I am thirsty for this water,\" said the little prince. \"Give me some of it to drink...\"", "And I understood what he had been looking for.", "I raised the bucket to his lips. He drank, his eyes closed. It was as sweet as some special festival treat. This water was indeed a different thing from ordinary nourishment. Its sweetness was born of the walk under the stars, the song of the pulley, the effort of my arms. It was good for the heart, like a present. When I was a little boy, the lights of the Christmas tree, the music of the Midnight Mass, the tenderness of smiling faces, used to make up, so, the radiance of the gifts I received.", "\"The men where you live,\" said the little prince, \"raise five thousand roses in the same garden-- and they do not find in it what they are looking for.\"", "\"They do not find it,\" I replied.", "\"And yet what they are looking for could be found in one single rose, or in a little water.\"", "\"Yes, that is true,\" I said.", "And the little prince added:", "\"But the eyes are blind. One must look with the heart...\"", "I had drunk the water. I breathed easily. At sunrise the sand is the color of honey. And that honey color was making me happy, too. What brought me, then, this sense of grief?", "\"You must keep your promise,\" said the little prince, softly, as he sat down beside me once more.", "\"What promise?\"", "\"You know-- a muzzle for my sheep... I am responsible for this flower...\"", "I took my rough drafts of drawings out of my pocket. The little prince looked them over, and laughed as he said:", "\"Your baobabs-- they look a little like cabbages.\"", "\"Oh!\"", "I had been so proud of my baobabs!", "\"Your fox-- his ears look a little like horns; and they are too long.\"", "And he laughed again.", "\"You are not fair, little prince,\" I said. \"I don‘t know how to draw anything except boa constrictors from the outside and boa constrictors from the inside.\"", "\"Oh, that will be all right,\" he said, \"children understand.\"", "So then I made a pencil sketch of a muzzle. And as I gave it to him my heart was torn.", "\"You have plans that I do not know about,\" I said.", "But he did not answer me. He said to me, instead:", "\"You know-- my descent to the earth... Tomorrow will be its anniversary.\"", "Then, after a silence, he went on:", "\"I came down very near here.\"", "And he flushed.", "And once again, without understanding why, I had a queer sense of sorrow. One question, however, occurred to me:", "\"Then it was not by chance that on the morning when I first met you-- a week ago-- you were strolling along like that, all alone, a thousand miles from any inhabited region? You were on the your back to the place where you landed?\"", "The little prince flushed again.", "And I added, with some hesitancy:", "\"Perhaps it was because of the anniversary?\"", "The little prince flushed once more. He never answered questions-- but when one flushes does that not mean \"Yes\"?", "\"Ah,\" I said to him, \"I am a little frightened--\"", "But he interrupted me.", "\"Now you must work. You must return to your engine. I will be waiting for you here. Come back tomorrow evening...\"", "But I was not reassured. I remembered the fox. One runs the risk of weeping a little, if one lets himself be tamed..."]}, {"num": 26, "title": "我修好了飞机", "paras": ["Beside the well there was the ruin of an old stone wall. When I came back from my work, the next evening, I saw from some distance away my little price sitting on top of a wall, with his feet dangling. And I heard him say:", "\"Then you don‘t remember. This is not the exact spot.\"", "Another voice must have answered him, for he replied to it:", "\"Yes, yes! It is the right day, but this is not the place.\"", "I continued my walk toward the wall. At no time did I see or hear anyone. The little prince, however, replied once again:", "\"--Exactly. You will see where my track begins, in the sand. You have nothing to do but wait for me there. I shall be there tonight.\"", "I was only twenty metres from the wall, and I still saw nothing.", "After a silence the little prince spoke again:", "\"You have good poison? You are sure that it will not make me suffer too long?\"", "I stopped in my tracks, my heart torn asunder; but still I did not understand.", "\"Now go away,\" said the little prince. \"I want to get down from the wall.\"", "I dropped my eyes, then, to the foot of the wall-- and I leaped into the air. There before me, facing the little prince, was one of those yellow snakes that take just thirty seconds to bring your life to an end. Even as I was digging into my pocked to get out my revolver I made a running step back. But, at the noise I made, the snake let himself flow easily across the sand like the dying spray of a fountain, and, in no apparent hurry, disappeared, with a light metallic sound, among the stones.", "I reached the wall just in time to catch my little man in my arms; his face was white as snow.", "\"What does this mean?\" I demanded. \"Why are you talking with snakes?\"", "I had loosened the golden muffler that he always wore. I had moistened his temples, and had given him some water to drink. And now I did not dare ask him any more questions. He looked at me very gravely, and put his arms around my neck. I felt his heart beating like the heart of a dying bird, shot with someone‘s rifle...", "\"I am glad that you have found what was the matter with your engine,\" he said. \"Now you can go back home--\"", "\"How do you know about that?\"", "I was just coming to tell him that my work had been successful, beyond anything that I had dared to hope. He made no answer to my question, but he added:", "\"I, too, am going back home today...\"", "Then, sadly--", "\"It is much farther... it is much more difficult...\"", "I realised clearly that something extraordinary was happening. I was holding him close in my arms as if he were a little child; and yet it seemed to me that he was rushing headlong toward an abyss from which I could do nothing to restrain him...", "His look was very serious, like some one lost far away.", "\"I have your sheep. And I have the sheep‘s box. And I have the muzzle...\" And he gave me a sad smile.", "I waited a long time. I could see that he was reviving little by little.", "\"Dear little man,\" I said to him, \"you are afraid...\"", "He was afraid, there was no doubt about that. But he laughed lightly.", "\"I shall be much more afraid this evening...\"", "Once again I felt myself frozen by the sense of something irreparable. And I knew that I could not bear the thought of never hearing that laughter any more. For me, it was like a spring of fresh water in the desert.", "\"Little man,\" I said, \"I want to hear you laugh again.\"", "But he said to me:", "\"Tonight, it will be a year... my star, then, can be found right above the place where I came to the Earth, a year ago...\"", "\"Little man,\" I said, \"tell me that it is only a bad dream-- this affair of the snake, and the meeting-place, and the star...\"", "But he did not answer my plea. He said to me, instead: \"The thing that is important is the thing that is not seen...\"", "\"Yes, I know...\"", "\"It is just as it is with the flower. If you love a flower that lives on a star, it is sweet to look at the sky at night. All the stars are a-bloom with flowers...\"", "\"Yes, I know...\"", "\"It is just as it is with the water. Because of the pulley, and the rope, what you gave me to drink was like music. You remember-- how good it was.\"", "\"Yes, I know...\"", "\"And at night you will look up at the stars. Where I live everything is so small that I cannot show you where my star is to be found. It is better, like that. My star will just be one of the stars, for you. And so you will love to watch all the stars in the heavens... they will all be your friends. And, besides, I am going to make you a present...\"", "He laughed again.", "\"Ah, little prince, dear little prince! I love to hear that laughter!\"", "\"That is my present. Just that. It will be as it was when we drank the water...\"", "\"What are you trying to say?\"", "\"All men have the stars,\" he answered, \"but they are not the same things for different people. For some, who are travelers, the stars are guides. For others they are no more than little lights in the sky. For others, who are scholars, they are problems . For my businessman they were wealth. But all these stars are silent. You-- you alone-- will have the stars as no one else has them--\"", "\"What are you trying to say?\"", "\"In one of the stars I shall be living. In one of them I shall be laughing. And so it will be as if all the stars were laughing, when you look at the sky at night... you-- only you-- will have stars that can laugh!\"", "And he laughed again.", "\"And when your sorrow is comforted (time soothes all sorrows) you will be content that you have known me. You will always be my friend. You will want to laugh with me. And you will sometimes open your window, so, for that pleasure... and your friends w ill be properly astonished to see you laughing as you look up at the sky! Then you will say to them, ‘Yes, the stars always make me laugh!‘ And they will think you are crazy. It will be a very shabby trick that I shall have played on you...\"", "And he laughed again.", "\"It will be as if, in place of the stars, I had given you a great number of little bells that knew how to laugh...\"", "And he laughed again. Then he quickly became serious:", "\"Tonight-- you know... do not come,\" said the little prince.", "\"I shall not leave you,\" I said.", "\"I shall look as if I were suffering. I shall look a little as if I were dying. It is like that. Do not come to see that. It is not worth the trouble...\"", "\"I shall not leave you.\"", "But he was worried.", "\"I tell you-- it is also because of the snake. He must not bite you. Snakes-- they are malicious creatures. This one might bite you just for fun...\"", "\"I shall not leave you.\"", "But a thought came to reassure him:", "\"It is true that they have no more poison for a second bite.\"", "That night I did not see him set out on his way. He got away from me without making a sound. When I succeeded in catching up with him he was walking along with a quick and resolute step. He said to me merely:", "\"Ah! You are there...\"", "And he took me by the hand. But he was still worrying.", "\"It was wrong of you to come. You will suffer. I shall look as if I were dead; and that will not be true...\"", "I said nothing.", "\"You understand... it is too far. I cannot carry this body with me. It is too heavy.\"", "I said nothing.", "\"But it will be like an old abandoned shell. There is nothing sad about old shells...\"", "I said nothing.", "He was a little discouraged. But he made one more effort:", "\"You know, it will be very nice. I, too, shall look at the stars. All the stars will be wells with a rusty pulley. All the stars will pour out fresh water for me to drink...\"", "I said nothing.", "\"That will be so amusing! You will have five hundred million little bells, and I shall have five hundred million springs of fresh water...\"", "And he too said nothing more, becuase he was crying...", "\"Here it is. Let me go on by myself.\"", "And he sat down, because he was afraid. Then he said, again:", "\"You know-- my flower... I am responsible for her. And she is so weak! She is so naive! She has four thorns, of no use at all, to protect herself against all the world...\"", "I too sat down, because I was not able to stand up any longer.", "\"There now-- that is all...\"", "He still hesitated a little; then he got up. He took one step. I could not move.", "There was nothing but a flash of yellow close to his ankle. He remained motionless for an instant. He did not cry out. He fell as gently as a tree falls. There was not even any sound, because of the sand."]}, {"num": 27, "title": "沙漠中的礼物", "paras": ["It was then that the fox appeared.", "And now six years have already gone by...", "I have never yet told this story. The companions who met me on my return were well content to see me alive. I was sad, but I told them: \"I am tired.\"", "Now my sorrow is comforted a little. That is to say-- not entirely. But I know that he did go back to his planet, because I did not find his body at daybreak. It was not such a heavy body... and at night I love to listen to the stars. It is like five hundred million little bells...", "But there is one extraordinary thing... when I drew the muzzle for the little prince, I forgot to add the leather strap to it. He will never have been able to fasten it on his sheep. So now I keep wondering: what is happening on his planet? Perhaps the sheep has eaten the flower...", "At one time I say to myself: \"Surely not! The little prince shuts his flower under her glass globe every night, and he watches over his sheep very carefully...\" Then I am happy. And there is sweetness in the laughter of all the stars.", "But at another time I say to myself: \"At some moment or other one is absent-minded, and that is enough! On some one evening he forgot the glass globe, or the sheep got out, without making any noise, in the night...\" And then the little bells are changed to tears...", "Here, then, is a great mystery. For you who also love the little prince, and for me, nothing in the universe can be the same if somewhere, we do not know where, a sheep that we never saw has-- yes or no?-- eaten a rose...", "Look up at the sky. Ask yourselves: is it yes or no? Has the sheep eaten the flower? And you will see how everything changes...", "And no grown-up will ever understand that this is a matter of so much importance!", "This is, to me, the loveliest and saddest landscape in the world. It is the same as that on the preceding page, but I have drawn it again to impress it on your memory. It is here that the little prince appeared on Earth, and disappeared.", "Look at it carefully so that you will be sure to recognise it in case you travel some day to the African desert. And, if you should come upon this spot, please do not hurry on. Wait for a time, exactly under the star. Then, if a little man appears who laughs, who has golden hair and who refuses to answer questions, you will know who he is. If this should happen, please comfort me. Send me word that he has come back.", "[ END ]"]}];

       schema 异步返回后刷新数据拿真实 select 选项 id */
    applyDefaultSchema();
    boot();
    if (!db) { setSync('off'); return; }
    if (LOCAL_MODE){
      /* 本地存储模式（GitHub Pages 等纯静态环境）：无需网络 getSchema，
         默认字段映射已在 applyDefaultSchema 就绪，直接加载本地数据 */
      setSync('local');
      loadProgress(); loadVocab(); loadQuotes();
      return;
    }
    var done = 0;
    function fin(){ done++; if (done === 3) { setSync('ok'); afterSchema(); } }
    function fail(){ done++; if (done === 3) { setSync('off'); afterSchema(); } }
    function afterSchema(){
      /* schema 就绪后重新拉取数据，写入真实选项 id */
      loadProgress(); loadVocab(); loadQuotes();
    }
    /* 超时兜底：任一 getSchema 挂起（不返回也不报错）时，2.5s 后按当前结果继续，绝不阻塞页面 */
    setTimeout(function(){ if (done < 3) { setSync('off'); afterSchema(); } }, 2500);
    function fill(F, O, fieldMap){
      return function(schema){
        var have = {};
        (schema.properties || []).forEach(function(f){
          have[f.name] = true;
          if ((f.type === 'select' || f.type === 'multi_select') && f.config && f.config.options) {
            O[f.name] = f.config.options;
            f.config.options.forEach(function(o){ OPT_BY_ID[o.id] = o.text; });
          }
        });
        /* 语义键 → 真实字段名（无条件写入，字段缺失时仍按默认名提交，服务端忽略即可） */
        Object.keys(fieldMap).forEach(function(k){ F[k] = fieldMap[k]; });
        /* select 选项兜底：schema 未返回 options 时用默认选项（select 传文本同样合法） */
        Object.keys(DEF_OPTS).forEach(function(real){
          if (have[real] && !O[real]) O[real] = DEF_OPTS[real].map(function(t){ return {id: t, text: t}; });
        });
        fin();
      };
    }
    db.getSchema({databaseId: 'JX6NNHqETPCo6GaABQHydi'}).then(fill(FV, OV, FIELDS_V)).catch(fail);
    db.getSchema({databaseId: 'LXzEDtUJMtIMCYtxmzDNzo'}).then(fill(FQ, OQ, FIELDS_Q)).catch(fail);
    db.getSchema({databaseId: 'C2H5fbkxbNzpqeZV0vFNux'}).then(fill(FP, OP, FIELDS_P)).catch(fail);
  }

  function optText(optArr, id){ if (!optArr || !optArr.length) return id; for (var i=0;i<optArr.length;i++){ if (optArr[i].id === id) return optArr[i].text; } return id; }
  function optId(optArr, text){ if (!optArr || !optArr.length) return text; for (var i=0;i<optArr.length;i++){ if (optArr[i].text === text) return optArr[i].id; } return text; }

  /* ── 分页查询助手（只从 result.results 取数；databaseId 按表内联字面量） ── */
  function queryAllV(maxPages){
    return new Promise(function(resolve, reject){
      var all = []; var cursor = null; var pages = 0;
      (function page(){
        if (pages >= (maxPages || 20)) { resolve(all); return; }
        db.query(cursor
          ? {databaseId: 'JX6NNHqETPCo6GaABQHydi', pageSize: 100, startCursor: cursor}
          : {databaseId: 'JX6NNHqETPCo6GaABQHydi', pageSize: 100}
        ).then(function(result){
          var rows = result.results || [];
          all = all.concat(rows);
          pages++;
          if (result.hasMore && result.nextCursor) { cursor = result.nextCursor; page(); }
          else { resolve(all); }
        }).catch(function(err){ reject(err); });
      })();
    });
  }

            progressAll[i][FP.status] = '已读'; progressAll[i][FP.completeDate] = todayStr; updated = true;
          }

        renderProgress(); renderToday(); renderReader();

  /* ================= 阅读器 ================= */
  function renderReader(){
    var ch = CHAPTERS[curChapter-1];
    if (!ch) return;
    els.chapterSelect.value = String(curChapter);
    els.readerMeta.textContent = '第 ' + curChapter + ' 章 · ' + ch.title + ' · 共 ' + ch.paras.length + ' 段';
    var rec = progressOf(curChapter);
    var st = rec ? (rec[FP.status] || '未读') : '未读';
    els.btnMarkRead.innerHTML = st === '已读'
      ? '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>本章已读 ✓'
      : '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>标记本章已读';
    var html = '';
    for (var i=0;i<ch.paras.length;i++){
      var p = ch.paras[i];
      var isQ = /^["“]/.test(p.trim());
      html += '<p' + (isQ ? ' class="quote"' : '') + '>' + wrapWords(p) + '</p>';
    }
    els.readerContent.innerHTML = html;
    renderChapterVocab();
  }
  function wrapWords(text){
    var re = /[A-Za-z\u00C0-\u024F']+|\S+/g;
    var out = ''; var m; var last = 0;
    while ((m = re.exec(text)) !== null){
      out += esc(text.slice(last, m.index));   // 保留单词间的空格/换行/标点，否则整段无法换行
      var t = m[0];
      if (/[A-Za-z\u00C0-\u024F]/.test(t)){
        var key = t.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g,'');
        out += '<span class="w" data-w="' + esc(key) + '">' + esc(t) + '</span>';
      } else { out += esc(t); }
      last = m.index + t.length;
    }
    out += esc(text.slice(last));
    return out;
  }
  els.readerContent.addEventListener('click', function(e){

  /* ================= 查词 ================= */
  var popupWord = ''; var popupSentence = ''; var popupMeaning = ''; var popupPos = '';
  function lookup(w){
    var k = w.toLowerCase();
    if (DICTIONARY[k]) return {pos: DICTIONARY[k].pos, meaning: DICTIONARY[k].meaning, hint: ''};
    var k2 = k.replace(/'(t|s|ve|re|ll|d)$/,'');
    if (k2 !== k && DICTIONARY[k2]) return {pos: DICTIONARY[k2].pos, meaning: DICTIONARY[k2].meaning, hint: '词形变化：' + w + ' 可能来自 ' + k2};
    var stems = [['ing$','e'],['ed$',''],['es$',''],['s$',''],['d$',''],['er$',''],['est$','']];
    for (var i=0;i<stems.length;i++){
      var s = k.replace(new RegExp(stems[i][0]), stems[i][1]);
      if (s !== k && s.length > 3 && DICTIONARY[s]) return {pos: DICTIONARY[s].pos, meaning: DICTIONARY[s].meaning, hint: '词形变化：可能为 ' + s + ' 的变体'};
    }
    return null;
  }
  function showPopup(w){
    var rec = lookup(w);
    popupWord = w;
    if (!rec){
      els.pw.textContent = w; els.pp.textContent = '';
      els.pm.textContent = '词典中未收录该词。';
      els.ph.className = 'ph hidden';
    } else {
      popupMeaning = rec.meaning; popupPos = rec.pos;
      els.pw.textContent = w; els.pp.textContent = rec.pos || '';
      els.pm.textContent = rec.meaning || '';
      els.ph.className = rec.hint ? 'ph' : 'ph hidden';
      els.ph.textContent = rec.hint || '';
    }
    popupSentence = sentenceOf(w);
    els.ps.textContent = '原句：' + (popupSentence || '（未找到当前上下文）');
    els.btnAddToVocab.textContent = existsInVocab(w) ? '已在生词本，点此设为学习中' : '加入生词本';
    els.popupMask.className = 'mask';
    els.popupMask.querySelector('.popup').style.display = 'block';
  }
  function sentenceOf(w){
    var ch = CHAPTERS[curChapter-1];
    if (!ch) return '';
    var re = new RegExp('[^.!?]*\\b' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b[^.!?]*[.!?]', 'i');
    for (var i=0;i<ch.paras.length;i++){
      var m = ch.paras[i].match(re);
      if (m) return m[0].trim();
    }
    return '';
  }
  function existsInVocab(w){
    var k = w.toLowerCase();
    for (var i=0;i<vocabAll.length;i++){
      if (String(vocabAll[i][FV.word] || '').toLowerCase() === k) return true;
    }
    return false;
  }
  function findVocabWord(w){
    var k = w.toLowerCase();
    for (var i=0;i<vocabAll.length;i++){
      if (String(vocabAll[i][FV.word] || '').toLowerCase() === k) return vocabAll[i];
    }
    return null;
  }

  /* ================= 生词本 ================= */
  function loadVocab(){
    if (!db) { els.vocabList.innerHTML = '<div class="empty">离线模式：无法读取生词本</div>'; renderToday(); return; }
    queryAllV(100).then(function(rows){
      vocabAll = rows;
      refreshVocabViews();
      renderChapterVocab();
      renderToday();
    }).catch(function(){ setSync('off'); renderToday(); });
  }
  function refreshVocabViews(){ renderVocab(); }
  function renderVocab(){
    var list = vocabAll;
    var kw = vocabSearch.trim().toLowerCase();
    var out = [];
    for (var i=0;i<list.length;i++){
      var r = list[i];
      var lv = r[FV.level] || '未学';
      if (vocabFilter !== 'all' && lv !== vocabFilter) continue;
      if (kw){
        var hay = ((r[FV.word]||'') + ' ' + (r[FV.meaning]||'')).toLowerCase();
        if (hay.indexOf(kw) === -1) continue;
      }
      out.push(r);
    }
    els.vocabShowCount.textContent = out.length + ' 条';
    if (!out.length){ els.vocabList.innerHTML = '<div class="empty">没有匹配的生词</div>'; return; }
    var html = '';
    for (var j=0;j<out.length;j++){
      html += vocabRowHtml(out[j]);
    }
    els.vocabList.innerHTML = html;
    bindVocabRows();
  }
  function vocabRowHtml(r){
    var lv = r[FV.level] || '未学';
    var lvCls = lv === '已掌握' ? 'lv2' : (lv === '学习中' ? 'lv1' : 'lv0');
    var due = r[FV.reviewDate] || '';
    var dueHtml = '';
    if (due && lv !== '已掌握'){
      var ds = String(due).slice(0,10);
      var over = ds < todayStr;
      dueHtml = '<span class="vdue' + (over ? ' over' : '') + '">' + (over ? '逾期复习 ' : '复习 ') + ds.slice(5) + '</span>';
    }
    return '<div class="vrow" data-id="' + esc(r._id) + '">' +
      '<div class="v-main">' +
        '<span class="vw">' + esc(r[FV.word]) + '</span>' +
        '<span class="vch">第' + (r[FV.chapter] || 0) + '章</span>' + dueHtml +
        '<div class="vm">' + esc(r[FV.meaning] || '') + '</div>' +
        (r[FV.sentence] ? '<div class="vs">' + esc(r[FV.sentence]) + '</div>' : '') +
        '<div class="level-btns">' +

          '<button data-act="学习中" class="on-' + (lv==='学习中'?'lv1':'') + '">学习中</button>' +
          '<button data-act="已掌握" class="on-' + (lv==='已掌握'?'lv2':'') + '">已掌握</button>' +

  function bindVocabRows(){
    var rows = els.vocabList.querySelectorAll('.vrow');

      (function(row){
        var id = row.getAttribute('data-id');

          btns[j].addEventListener('click', (function(btn){ return function(){ setVocabLevel(id, btn.getAttribute('data-act')); }; })(btns[j]));
        }

  function setVocabLevel(recordId, level){
    var rec = null;
    for (var i=0;i<vocabAll.length;i++){ if (vocabAll[i]._id === recordId) rec = vocabAll[i]; }

    var props = {};
    props[FV.level] = {select: optId(OV[FV.level], level)};
    if (level === '学习中'){ props[FV.reviewDate] = {date: todayStr}; }
    runWrite('updateRecord', DB_V, recordId, props).then(function(){
      rec[FV.level] = level;
      if (level === '学习中') rec[FV.reviewDate] = todayStr;
      renderVocab(); renderChapterVocab(); renderToday();
    });
  }
  function setVocabLevelByWord(w, level){
    var rec = findVocabWord(w);
    if (!rec) return;
    setVocabLevel(rec._id, level);

    props[FV.meaning] = {text: m};
    props[FV.sentence] = {text: els.newSentence.value.trim()};
    props[FV.chapter] = {number: parseInt(els.newChapter.value,10) || 0};
    props[FV.level] = {select: els.newLevel.value || optId(OV[FV.level], '未学')};
    props[FV.reviewDate] = {date: todayStr};
    runWrite('addRecord', DB_V, null, props).then(function(){
      toast('生词「' + w + '」已添加');
      els.newWord.value = ''; els.newMeaning.value = ''; els.newSentence.value = ''; els.newChapter.value = '';
      saveFormCache('vocab');
      loadVocab();
    });
  });

  /* ================= 摘录本 ================= */
  function buildTagChecks(){
    var opts = OQ[FQ.tags] || [];
    if (!opts.length){ els.tagChecks.innerHTML = '<span class="txt-sub">暂无标签选项</span>'; return; }
    var html = '';
    for (var i=0;i<opts.length;i++){
      html += '<label><input type="checkbox" name="newTags" value="' + esc(opts[i].id) + '">' + esc(opts[i].text) + '</label>';
    }
    els.tagChecks.innerHTML = html;
  }
  function loadQuotes(){
    if (!db){ els.quoteList.innerHTML = '<div class="empty">离线模式：无法读取摘录</div>'; renderToday(); return; }
    db.query({databaseId: 'LXzEDtUJMtIMCYtxmzDNzo', pageSize: 50}).then(function(result){
      quotesAll = result.results || [];
      quotesCursor = result.nextCursor || null;
      quotesHasMore = !!result.hasMore;
      renderQuotes();
      renderToday();
    }).catch(function(){ setSync('off'); renderToday(); });
  }
  function renderQuotes(){
    els.quoteShowCount.textContent = quotesAll.length + ' 条';
    if (!quotesAll.length){ els.quoteList.innerHTML = '<div class="empty">还没有摘录。阅读时点击单词查词，遇到好句就来这里记录吧</div>'; return; }
    var html = '';
    for (var i=0;i<quotesAll.length;i++){
      var r = quotesAll[i];
      var tags = r[FQ.tags] || [];
      var tagHtml = '';
      for (var j=0;j<tags.length;j++) tagHtml += '<span class="chip">' + esc(tags[j]) + '</span>';
      html += '<div class="qcard" data-id="' + esc(r._id) + '">' +
        '<div class="qt">' + esc(r[FQ.quote]) + '</div>' +
        (r[FQ.translation] ? '<div class="qtr">' + esc(r[FQ.translation]) + '</div>' : '') +
        (r[FQ.note] ? '<div class="qnote">' + esc(r[FQ.note]) + '</div>' : '') +
        '<div class="qmeta">' +
          '<span class="chip2">第 ' + (r[FQ.chapter]||0) + ' 章</span>' + tagHtml +
          (r[FQ.date] ? '<span class="chip2">' + esc(String(r[FQ.date]).slice(0,10)) + '</span>' : '') +
          '<button class="qdel" data-del="1">删除</button>' +
        '</div></div>';
    }
    els.quoteList.innerHTML = html;
    var dels = els.quoteList.querySelectorAll('.qdel');
    for (var k=0;k<dels.length;k++){
      dels[k].addEventListener('click', (function(btn){ return function(){
        var id = btn.closest('.qcard').getAttribute('data-id');
        confirmBox('删除这条摘录？', '删除后不可恢复。', function(){
          runWrite('deleteRecord', DB_Q, id, null).then(function(){
            for (var i=0;i<quotesAll.length;i++){ if (quotesAll[i]._id === id){ quotesAll.splice(i,1); break; } }
            renderQuotes(); renderToday();
            toast('摘录已删除');
          });
        });
      }; })(dels[k]));
    }
    els.btnQuoteMore.style.display = quotesHasMore ? '' : 'none';
  }
  els.btnQuoteMore.addEventListener('click', function(){
    if (!quotesCursor) return;
    db.query({databaseId: 'LXzEDtUJMtIMCYtxmzDNzo', pageSize: 50, startCursor: quotesCursor}).then(function(result){
      var rows = result.results || [];
      quotesAll = quotesAll.concat(rows);
      quotesCursor = result.nextCursor || null;
      quotesHasMore = !!result.hasMore;
      renderQuotes();
    }).catch(function(){ setSync('off'); });
  });
  /* 公共：保存摘录记录 */
  function submitQuoteRecord(q, chapter, date, translation, note, tags, onOk){
    if (!q){ toast('请填写摘录原句'); return false; }
    var props = {};
    props[FQ.quote] = {text: q};
    props[FQ.chapter] = {number: parseInt(chapter,10) || 0};
    props[FQ.translation] = {text: (translation||'').trim()};
    props[FQ.note] = {text: (note||'').trim()};
    props[FQ.tags] = {multi_select: tags || []};
    props[FQ.date] = {date: date || todayStr};
    runWrite('addRecord', DB_Q, null, props).then(function(){
      toast('摘录已保存');
      if (onOk) onOk();
      loadQuotes();
    });
    return true;
  }
  els.btnAddQuote.addEventListener('click', function(){
    var q = els.newQuote.value.trim();
    if (!q){ toast('请填写摘录原句'); return; }
    var tags = [];
    var checks = els.tagChecks.querySelectorAll('input[name="newTags"]:checked');
    for (var i=0;i<checks.length;i++) tags.push(checks[i].value);
    submitQuoteRecord(q, els.newQuoteChapter.value, els.newQuoteDate.value,
      els.newTranslation.value, els.newNote.value, tags, function(){
        els.newQuote.value = ''; els.newQuoteChapter.value = ''; els.newTranslation.value = '';
        els.newNote.value = ''; els.newQuoteDate.value = '';
        for (var j=0;j<checks.length;j++) checks[j].checked = false;
        saveFormCache('quote');
      });
  });

  /* ================= 选中句子摘录 ================= */
  var selText = '';
  function isInReader(el){
    while (el){ if (el && el.id === 'readerContent') return true; el = el.parentNode; }
    return false;
  }
  function updateQuoteBar(){
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString()){ hideQuoteBar(); return; }
    var an = sel.anchorNode, fn = sel.focusNode;
    if (!an || !fn || !isInReader(an) || !isInReader(fn)){ hideQuoteBar(); return; }
    var txt = sel.toString().replace(/\s+/g,' ').trim();
    if (txt.length < 2){ hideQuoteBar(); return; }
    selText = txt;
    els.quoteBarHint.textContent = txt.length > 26 ? txt.slice(0,26) + '…' : txt;
    var rect = sel.getRangeAt(0).getBoundingClientRect();
    if (!rect || (!rect.width && !rect.height)){ hideQuoteBar(); return; }
    els.quoteBar.style.display = 'flex';
    var bw = els.quoteBar.offsetWidth;
    var x = rect.left + rect.width/2 - bw/2;
    x = Math.max(8, Math.min(x, window.innerWidth - bw - 8));
    var y = rect.top - 50;
    if (y < 8) y = rect.bottom + 10;
    els.quoteBar.style.left = x + 'px';
    els.quoteBar.style.top = y + 'px';
  }
  function hideQuoteBar(){ els.quoteBar.style.display = 'none'; }
  function buildMqTagChecks(){
    var opts = OQ[FQ.tags] || [];
    if (!opts.length){ els.mqTags.innerHTML = '<span class="txt-sub">暂无标签选项</span>'; return; }
    var html = '';
    for (var i=0;i<opts.length;i++){
      html += '<label><input type="checkbox" name="mqTags" value="' + esc(opts[i].id) + '">' + esc(opts[i].text) + '</label>';
    }
    els.mqTags.innerHTML = html;
  }
  function openQuoteMask(text){
    buildMqTagChecks();
    els.mqQuote.value = text || '';
    els.mqChapter.value = curChapter || '';
    els.mqDate.value = todayStr;
    els.mqTranslation.value = ''; els.mqNote.value = '';
    var checks = els.mqTags.querySelectorAll('input[name="mqTags"]:checked');
    for (var i=0;i<checks.length;i++) checks[i].checked = false;
    els.quoteMask.className = 'mask';
    setTimeout(function(){ els.mqQuote.focus(); }, 60);
  }
  function closeQuoteMask(){ els.quoteMask.className = 'mask hidden'; }

  var quoteBarTimer = null;
  document.addEventListener('selectionchange', function(){
    clearTimeout(quoteBarTimer);
    quoteBarTimer = setTimeout(updateQuoteBar, 150);
  });
  document.addEventListener('scroll', hideQuoteBar, true);
  document.addEventListener('click', function(e){
    if (e.target && e.target.closest && !e.target.closest('#quoteBar') && !e.target.closest('#quoteMask')) hideQuoteBar();
  });
  els.btnQuoteBar.addEventListener('mousedown', function(e){ e.preventDefault(); });  /* 防止点击夺走选区 */
  els.btnQuoteBar.addEventListener('click', function(){
    var t = selText;
    try { if (window.getSelection) window.getSelection().removeAllRanges(); } catch(e){}
    hideQuoteBar();
    if (t) openQuoteMask(t);
  });
  els.btnMqSave.addEventListener('click', function(){
    submitQuoteRecord(els.mqQuote.value, els.mqChapter.value, els.mqDate.value,
      els.mqTranslation.value, els.mqNote.value,
      (function(){
        var arr = []; var cs = els.mqTags.querySelectorAll('input[name="mqTags"]:checked');
        for (var i=0;i<cs.length;i++) arr.push(cs[i].value);
        return arr;
      })(),
      closeQuoteMask);
  });
  els.btnMqCancel.addEventListener('click', closeQuoteMask);
  els.mqClose.addEventListener('click', closeQuoteMask);
  els.quoteMask.addEventListener('click', function(e){ if (e.target === els.quoteMask) closeQuoteMask(); });
  els.btnClearQuotes.addEventListener('click', function(){
    confirmBox('清空全部摘录？', '将删除摘录本中全部 ' + quotesAll.length + ' 条记录，且不可恢复。建议先点右上角「导出备份」。', function(){
      var ids = [];
      for (var i=0;i<quotesAll.length;i++) ids.push(quotesAll[i]._id);
      var k = 0;
      (function next(){
        if (k >= ids.length){ quotesAll = []; renderQuotes(); renderToday(); toast('摘录已清空'); return; }
        runWrite('deleteRecord', DB_Q, ids[k++], null).then(next);
      })();
    });
  });

  /* ================= 今天要处理 ================= */
  function renderToday(){
    /* 今日阅读：第一本未读章节 */
    var next = null;
    for (var i=0;i<progressAll.length;i++){
      var st = progressAll[i][FP.status] || '未读';
      if (st !== '已读'){ next = progressAll[i]; break; }
    }
    var readCount = 0;
    for (var j=0;j<progressAll.length;j++){ if ((progressAll[j][FP.status]||'') === '已读') readCount++; }
    var total = progressAll.length || 27;
    els.statReadCount.textContent = readCount + '/' + total;
    els.readBar.style.width = (total ? Math.round(readCount/total*100) : 0) + '%';
    if (next){
      els.todayChapterLine.textContent = '下一章：第 ' + (next[FP.chapter]||'?') + ' 章 · ' + (next[FP.title]||'');
      els.todayReadHint.textContent = readCount >= total ? '全部读完，可重新复习' : '读完记得点「标记本章已读」';
    } else {
      els.todayChapterLine.textContent = '恭喜！27 章已全部读完';
      els.todayReadHint.textContent = '可以回到第一章开始复习';
    }
    els.btnGoRead.onclick = function(){
      var n = next ? (next[FP.chapter] || 1) : 1;
      switchTab('reader');
      openChapter(n);
    };

    /* 生词复习：逾期（红）+ 今日到期 */
    var overdue = []; var dueToday = [];
    for (var k=0;k<vocabAll.length;k++){
      var r = vocabAll[k];
      var lv = r[FV.level] || '未学';
      if (lv === '已掌握') continue;
      var d = r[FV.reviewDate] ? String(r[FV.reviewDate]).slice(0,10) : '';
      if (d && d < todayStr) overdue.push(r);
      else if (d === todayStr) dueToday.push(r);
    }
    els.overdueBadge.style.display = overdue.length ? '' : 'none';
    els.overdueBadge.textContent = overdue.length;
    var html = '';
    if (overdue.length){
      for (var a=0;a<Math.min(overdue.length,4);a++){
        html += '<div class="today-item overdue" data-w="' + esc(overdue[a][FV.word]) + '">' +
          '<span class="w">' + esc(overdue[a][FV.word]) + '</span>' +
          '<span class="m">' + esc(overdue[a][FV.meaning] || '') + '</span>' +
          '</div>';
      }
      if (overdue.length > 4) html += '<div class="today-sub">…还有 ' + (overdue.length-4) + ' 个逾期词</div>';
    } else if (dueToday.length){
      for (var b=0;b<Math.min(dueToday.length,4);b++){
        html += '<div class="today-item" data-w="' + esc(dueToday[b][FV.word]) + '">' +
          '<span class="w">' + esc(dueToday[b][FV.word]) + '</span>' +
          '<span class="m">' + esc(dueToday[b][FV.meaning] || '') + '</span>' +
          '</div>';
      }
    } else {
      html = '<div class="today-empty">今天没有到期生词，去阅读发现新词吧</div>';
    }
    els.todayVocab.innerHTML = html;
    var items = els.todayVocab.querySelectorAll('.today-item');
    for (var c=0;c<items.length;c++){
      items[c].addEventListener('click', (function(el){ return function(){
        switchTab('vocab');
        var w = el.getAttribute('data-w');
        els.vocabSearch.value = w;
        vocabSearch = w.toLowerCase();
        renderVocab();
        setTimeout(function(){ var row = els.vocabList.querySelector('.vw'); if (row) row.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
      }; })(items[c]));
    }
    els.btnGoVocab.onclick = function(){ switchTab('vocab'); };

    /* 掌握概览 */
    var mastered = 0, learning = 0;
    for (var d=0;d<vocabAll.length;d++){
      var l2 = vocabAll[d][FV.level] || '未学';
      if (l2 === '已掌握') mastered++;
      else if (l2 === '学习中') learning++;
    }
    els.statTotalWords.textContent = vocabAll.length;
    els.statMastered.textContent = mastered;
    els.statLearning.textContent = learning;
    var pct = vocabAll.length ? Math.round(mastered/vocabAll.length*100) : 0;
    els.ringArc.setAttribute('stroke-dashoffset', String(238.8 * (1 - pct/100)));
    els.statQuoteCount.textContent = quotesAll.length;
  }

  /* ================= Tab 切换 ================= */
  function switchTab(name){
    ['reader','vocab','quotes'].forEach(function(n){
      document.getElementById('tab-' + n).className = n === name ? '' : 'hidden';
    });
    var sel = name === 'reader' ? '#tabs' : '#tabbar';
    var btns = document.querySelectorAll(sel + ' button');
    for (var i=0;i<btns.length;i++){
      btns[i].className = btns[i].getAttribute('data-tab') === name ? 'on' : '';
    }
    if (name === 'reader' && !els.readerContent.innerHTML) renderReader();
    window.scrollTo(0,0);
  }
  function bindTabs(root){
    var btns = root.querySelectorAll('button[data-tab]');
    for (var i=0;i<btns.length;i++){
      btns[i].addEventListener('click', function(){ switchTab(this.getAttribute('data-tab')); });
    }
  }
  bindTabs(els.tabs); bindTabs(els.tabbar);

  /* ================= 确认弹窗 ================= */
  var confirmCb = null;
  function confirmBox(title, text, cb){
    els.confirmTitle.textContent = title;
    els.confirmText.textContent = text;
    confirmCb = cb;
    els.confirmMask.className = 'mask';
  }
  els.confirmNo.addEventListener('click', function(){ els.confirmMask.className = 'mask hidden'; });
  els.confirmYes.addEventListener('click', function(){
    els.confirmMask.className = 'mask hidden';
    if (confirmCb){ var cb = confirmCb; confirmCb = null; cb(); }
  });

  /* ================= 导出备份 ================= */
  els.btnExport.addEventListener('click', function(){
    if (!db){ toast('离线模式，暂无法导出'); return; }
    els.btnExport.disabled = true;
    Promise.all([
      queryAllV(100),
      queryAllQ(100),
      queryAllP(100)
    ]).then(function(arr){
      var data = {
        exportedAt: new Date().toISOString(),
        app: '小王子英文精读工作台',
        vocab: arr[0], quotes: arr[1], progress: arr[2]
      };
      var blob = new Blob([JSON.stringify(data, null, 1)], {type:'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'prince-backup-' + todayStr + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('已导出 JSON 备份（生词 ' + arr[0].length + ' · 摘录 ' + arr[1].length + ' · 进度 ' + arr[2].length + '）');
      els.btnExport.disabled = false;
    }).catch(function(){ els.btnExport.disabled = false; setSync('off'); toast('导出失败，请重试'); });
  });

  /* ================= 表单本地缓存（addRecord 配套） ================= */
  function saveFormCache(kind){
    try {
      if (kind === 'vocab'){
        var v = {word: els.newWord.value, meaning: els.newMeaning.value, sentence: els.newSentence.value, chapter: els.newChapter.value};
        localStorage.setItem('wb_prince_form_vocab', JSON.stringify(v));
      } else {
        var q = {quote: els.newQuote.value, chapter: els.newQuoteChapter.value, date: els.newQuoteDate.value,
                 translation: els.newTranslation.value, note: els.newNote.value};
        localStorage.setItem('wb_prince_form_quote', JSON.stringify(q));
      }
    } catch(e){}
  }
  function restoreForms(){
    try {
      var v = JSON.parse(localStorage.getItem('wb_prince_form_vocab') || 'null');
      if (v){ els.newWord.value = v.word||''; els.newMeaning.value = v.meaning||''; els.newSentence.value = v.sentence||''; els.newChapter.value = v.chapter||''; }
      var q = JSON.parse(localStorage.getItem('wb_prince_form_quote') || 'null');
      if (q){ els.newQuote.value = q.quote||''; els.newQuoteChapter.value = q.chapter||''; els.newQuoteDate.value = q.date||''; els.newTranslation.value = q.translation||''; els.newNote.value = q.note||''; }
    } catch(e){}
  }
  ['newWord','newMeaning','newSentence','newChapter'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){ saveFormCache('vocab'); });
  });
  ['newQuote','newQuoteChapter','newQuoteDate','newTranslation','newNote'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){ saveFormCache('quote'); });
  });

  /* 摘录数 > 30 温和提示备份 */
  var _qi = setInterval(function(){
    if (quotesAll.length > 30){
      clearInterval(_qi);
      toast('摘录已积累 ' + quotesAll.length + ' 条，建议右上角导出备份');
    }
    if (quotesAll.length) clearInterval(_qi);
  }, 1500);

  initSchema();
})();
</script>
</body>
</html>
