<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 语境阅读器 - StoryReader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --highlight: #f59e0b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }
        .screen.active {
            display: flex;
        }
        
        /* Setup Screen */
        .setup-container {
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            box-shadow: 0 24px 48px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
        }
        .setup-container h1 { font-size: 2.5rem; margin-top: 0; margin-bottom: 0.5rem; text-align: center; }
        .setup-container p { color: var(--text-muted); text-align: center; margin-bottom: 2rem; }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #cbd5e1;
        }
        .form-control {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', monospace;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .file-label {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed var(--text-muted);
            padding: 1.5rem;
            border-radius: 16px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.2s;
            display: block;
            text-align: center;
            margin-top: 1rem;
        }
        .file-label:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }
        #file-input { display: none; }
        
        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1.5rem;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Screen */
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 2rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Reader Screen */
        .reader-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2rem;
        }
        .btn-back {
            background: transparent;
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-back:hover { background: rgba(255,255,255,0.1); }
        .progress-text { color: var(--text-muted); font-weight: 500; font-family: monospace; font-size: 1.1rem; }
        
        .reader-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
        }

        .sentence-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            box-shadow: 0 24px 48px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        .sentence-text {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 1.5rem;
        }

        .sentence-translation {
            font-size: 1.3rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.5;
            border-left: 4px solid var(--accent);
            padding-left: 1rem;
        }

        .highlight-word {
            color: var(--highlight);
            border-bottom: 2px dashed var(--highlight);
            cursor: help;
        }

        .vocab-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            border-top: 1px solid var(--card-border);
            padding-top: 2rem;
        }

        .vocab-item {
            background: rgba(255,255,255,0.05);
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        .vocab-item-word {
            font-weight: 700;
            color: var(--highlight);
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
        }

        .vocab-item-meaning {
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .controls {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            width: 100%;
        }

        .control-hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-top: 2rem;
        }
        .control-hint kbd {
            background: rgba(255,255,255,0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-family: monospace;
            border: 1px solid rgba(255,255,255,0.2);
        }


        /* Login Screen */
        .auth-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 40px; border-radius: 24px; text-align: center; max-width: 400px; margin: 0 auto; width: 100%; }
        .auth-card input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-size: 18px; text-align: center; margin-bottom: 20px; outline:none; }
        .auth-card input:focus { border-color: var(--accent); }

        /* Dashboard Screen */
        .dash-header { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 16px 24px; border-radius: 16px; border: 1px solid var(--card-border); width: 100%; margin-bottom: 24px; }
        .user-info { font-weight: 600; font-size: 18px; display: flex; align-items: center; gap: 10px;}
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; width: 100%; }
        .article-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 24px; border-radius: 20px; cursor: pointer; transition: all 0.3s; position: relative; }
        .article-card:hover { transform: translateY(-5px); border-color: var(--accent); background: rgba(255,255,255,0.1); }
        .article-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
        .article-meta { font-size: 14px; color: var(--text-muted); display:flex; justify-content: space-between;}
        .delete-btn { position: absolute; top: 12px; right: 12px; background: rgba(239, 68, 68, 0.2); color: #f87171; border: none; width: 24px; height: 24px; border-radius: 12px; cursor: pointer; display: none;}
        .article-card:hover .delete-btn { display: block; }
        .delete-btn:hover { background: #ef4444; color: white; }
        
        .add-card { border: 2px dashed rgba(255,255,255,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-muted); min-height: 150px; }
        .add-card:hover { border-color: var(--accent); color: white; }

        /* Float Back to Hub */
        .float-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .float-back:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <a href="../learning.html" class="float-back">⬅️ 返回学习天地</a>


    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="auth-card">
            <h2 style="margin-bottom: 24px;">创建或选择你的学习账号</h2>
            <div id="user-list" style="margin-bottom: 1.5rem; text-align: left; max-height: 250px; overflow-y: auto;">
            </div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="username-input" placeholder="输入名字 (如: Tom)" autocomplete="off" style="flex-grow:1; margin-bottom: 0;">
                <button class="btn-primary" style="white-space: nowrap; margin-top: 0;" onclick="loginUser()">创建/登录</button>
            </div>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen">
        <div class="dash-header">
            <div class="user-info">
                <span style="font-size: 24px;">🧑‍🎓</span>
                <span>当前学习者：<span id="current-username" style="color: var(--accent);"></span></span>
            </div>
            <button class="btn-back" onclick="logout()">切换账号</button>
        </div>
        
        <h2 style="align-self: flex-start; margin-bottom: 10px;">我的故事库</h2>
        <div class="grid" id="library-grid">
            <!-- Cards injected here -->
        </div>
    </div>

    <!-- Setup Screen -->
    <div id="setup-screen" class="screen">
        <div class="setup-container">
            <button class="btn-back" style="margin-bottom: 1rem;" onclick="switchScreen('dashboard-screen')">⬅️ 返回故事库</button>
            <h1>AI 语境阅读器</h1>
            <p>导入单词表，AI 自动生成自然口语文章并带读</p>
            
            <div class="form-group">
                <label>API Key (已自动配置为你笔记本中的 DeepSeek 密钥)</label>
                <input type="password" id="api-key" class="form-control" value="sk-20c2bbdf4cbd4f74b0fed64dea6921ce" placeholder="sk-...">
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 2;">
                    <label>API Base URL</label>
                    <input type="text" id="api-base" class="form-control" value="https://api.deepseek.com/v1">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>模型名称</label>
                    <input type="text" id="api-model" class="form-control" value="deepseek-v4-pro">
                </div>
            </div>

            <div style="margin: 1.5rem 0; text-align: center; color: var(--text-muted); font-size: 0.9rem;">— 选择以下任意一种方式导入单词 —</div>
            
            <div class="form-group" style="margin-bottom: 1rem;">
                <textarea id="text-input" class="form-control" rows="3" style="resize: vertical;" placeholder="直接在此粘贴要练习的单词 (用空格、换行或逗号隔开)&#10;例如: abandon ability absent"></textarea>
            </div>

            <div style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">或者</div>

            <label for="file-input" class="file-label" id="file-label" style="margin-top: 1rem;">
                📂 导入 Markdown 单词表文件
                <div style="font-size: 0.9rem; color: #94a3b8; margin-top: 0.5rem; font-weight: 400;">请选择文件 (支持 .md / .txt)</div>
            </label>
            <input type="file" id="file-input" accept=".md, .txt" />
            
            <button id="btn-generate" class="btn-primary" disabled>✨ 立即生成专属短文</button>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="screen" style="justify-content: center;">
        <div class="loader"></div>
        <h2 style="margin: 0; color: #fff;">AI 正在创作中...</h2>
        <p style="color: var(--text-muted); margin-top: 1rem;">这可能需要十秒钟左右，请稍候</p>
    </div>

    <!-- Reader Screen -->
    <div id="reader-screen" class="screen">
        <div class="reader-header">
            <button class="btn-back" onclick="initDashboard()">⬅️ 返回故事库</button>
            <div class="progress-text" id="progress-text">1 / 5</div>
        </div>
        
        <div class="reader-content">
            <div class="sentence-card">
                <div class="sentence-text" id="sentence-text"></div>
                <div class="sentence-translation" id="sentence-translation"></div>
                <div class="vocab-list" id="vocab-list"></div>
            </div>
            
            <div class="control-hint">
                <p>按下 <kbd>Space 空格键</kbd> 朗读当前句子并进入下一句</p>
                <p style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.7;">按下 <kbd>←</kbd> 返回上一句</p>
            </div>
        </div>
    </div>

    <!-- Done Screen -->
    <div id="done-screen" class="screen" style="justify-content: center; text-align: center;">
        <h1 style="font-size: 4rem; margin-bottom: 1rem;">🎉 太棒了！</h1>
        <p style="font-size: 1.5rem; color: var(--text-muted);">你已经读完了整段材料，词汇掌握度+1</p>
        <button class="btn-primary" style="max-width: 300px; margin-top: 2rem;" onclick="initDashboard()">返回故事库</button>
    </div>

    <script>
        // DOM Elements
        const setupScreen = document.getElementById('setup-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const readerScreen = document.getElementById('reader-screen');
        const doneScreen = document.getElementById('done-screen');
        
        const apiKeyInput = document.getElementById('api-key');
        const apiBaseInput = document.getElementById('api-base');
        const apiModelInput = document.getElementById('api-model');
        const textInput = document.getElementById('text-input');
        const fileInput = document.getElementById('file-input');
        const fileLabel = document.getElementById('file-label');
        const btnGenerate = document.getElementById('btn-generate');
        
        const sentenceText = document.getElementById('sentence-text');
        const sentenceTranslation = document.getElementById('sentence-translation');
        const vocabListEl = document.getElementById('vocab-list');
        const progressText = document.getElementById('progress-text');

        // State
        let currentUser = '';
        let uploadedVocab = [];
        let generatedStory = [];
        let currentIndex = 0;
        let currentStoryIndex = -1;
        let savedStories = [];

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- AUTH & DASHBOARD ---
        let createdUsers = JSON.parse(localStorage.getItem('game_portal_users') || '[]');

        function saveUsers() {
            localStorage.setItem('game_portal_users', JSON.stringify(createdUsers));
        }

        function renderUserList() {
            const listDiv = document.getElementById('user-list');
            if (createdUsers.length === 0) {
                listDiv.innerHTML = '<div style="color: var(--text-muted); text-align:center; padding: 1rem 0;">还没有账号，请在下方创建一个。</div>';
                return;
            }
            listDiv.innerHTML = createdUsers.map(u => `
                <div style="display:flex; justify-content:space-between; align-items:center; background: rgba(255,255,255,0.05); padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--card-border);">
                    <div style="font-weight:600; cursor:pointer; flex-grow:1;" onclick="loginAs('${u}')">🧑‍🎓 ${u}</div>
                    <button style="background:transparent; border:none; color:#ef4444; cursor:pointer; padding: 0.5rem;" onclick="deleteUser('${u}')">🗑️ 删除</button>
                </div>
            `).join('');
        }

        function loginAs(name) {
            currentUser = name;
            localStorage.setItem('sr_current_user', name);
            if (!createdUsers.includes(name)) {
                createdUsers.push(name);
                saveUsers();
            }
            initDashboard();
        }

        function loginUser() {
            const name = document.getElementById('username-input').value.trim();
            if(!name) return alert("请输入名字！");
            loginAs(name);
        }

        function deleteUser(name) {
            if (confirm(`确定要删除用户 "${name}" 的所有故事记录吗？`)) {
                createdUsers = createdUsers.filter(u => u !== name);
                saveUsers();
                localStorage.removeItem(`sr_stories_${name}`);
                if (currentUser === name) {
                    logout();
                } else {
                    renderUserList();
                }
            }
        }

        function logout() {
            localStorage.removeItem('sr_current_user');
            currentUser = '';
            renderUserList();
            switchScreen('login-screen');
        }

        function loadStories() {
            savedStories = JSON.parse(localStorage.getItem(`sr_stories_${currentUser}`) || '[]');
        }

        function saveStories() {
            localStorage.setItem(`sr_stories_${currentUser}`, JSON.stringify(savedStories));
        }

        function initDashboard() {
            document.getElementById('current-username').innerText = currentUser;
            loadStories();
            
            const grid = document.getElementById('library-grid');
            grid.innerHTML = '';

            const addCard = document.createElement('div');
            addCard.className = 'article-card add-card';
            addCard.innerHTML = `
                <div style="font-size: 40px;">➕</div>
                <div style="font-weight: 600;">新建 AI 故事</div>
            `;
            addCard.onclick = () => {
                document.getElementById('text-input').value = '';
                document.getElementById('file-input').value = '';
                uploadedVocab = [];
                document.getElementById('btn-generate').disabled = true;
                const fileLabel = document.getElementById('file-label');
                fileLabel.innerHTML = `📂 导入 Markdown 单词表文件<div style="font-size: 0.9rem; color: #94a3b8; margin-top: 0.5rem; font-weight: 400;">请选择文件 (支持 .md / .txt)</div>`;
                fileLabel.style.borderColor = 'var(--text-muted)';
                switchScreen('setup-screen');
            };
            grid.appendChild(addCard);

            savedStories.forEach((story, idx) => {
                const card = document.createElement('div');
                card.className = 'article-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteStory(event, ${idx})">×</button>
                    <div class="article-title">${story.title}</div>
                    <div class="article-meta">
                        <span>共 ${story.items.length} 句</span>
                        <span style="color:var(--accent); font-weight:600;">${story.progress && story.progress < story.items.length ? `进度: ${story.progress + 1} / ${story.items.length}` : (story.progress >= story.items.length ? '✅ 已通关' : '新生成')}</span>
                        <span>${story.date}</span>
                    </div>
                `;
                card.onclick = () => startStory(idx);
                grid.appendChild(card);
            });
            
            switchScreen('dashboard-screen');
        }

        function deleteStory(e, idx) {
            e.stopPropagation();
            if(confirm('确定要删除这个故事吗？')) {
                savedStories.splice(idx, 1);
                saveStories();
                initDashboard();
            }
        }

        function startStory(idx) {
            currentStoryIndex = idx;
            generatedStory = savedStories[idx].items;
            currentIndex = savedStories[idx].progress || 0;
            switchScreen('reader-screen');
            showCurrentSentence();
        }

        // Restore Settings & Boot
        window.onload = () => {
            if(localStorage.getItem('story_api_key')) apiKeyInput.value = localStorage.getItem('story_api_key');
            if(localStorage.getItem('story_api_base')) apiBaseInput.value = localStorage.getItem('story_api_base');
            
            let savedModel = localStorage.getItem('story_api_model');
            if (savedModel === 'V4 PRO') savedModel = 'deepseek-v4-pro'; // 自动修复旧的错误缓存
            if(savedModel) apiModelInput.value = savedModel;

            const savedUser = localStorage.getItem('sr_current_user');
            if (savedUser) {
                currentUser = savedUser;
                initDashboard();
            } else {
                renderUserList();
                switchScreen('login-screen');
            }
        };

        function saveSettings() {
            localStorage.setItem('story_api_key', apiKeyInput.value.trim());
            localStorage.setItem('story_api_base', apiBaseInput.value.trim());
            localStorage.setItem('story_api_model', apiModelInput.value.trim());
        }

        // Direct Text Parsing
        textInput.addEventListener('input', () => {
            const val = textInput.value.trim();
            if (val) {
                const words = val.split(/[\s,，、;；]+/);
                uploadedVocab = words.filter(w => w.length > 0).map(w => ({ word: w, meaning: "由大模型翻译" }));
                if (uploadedVocab.length > 0) {
                    btnGenerate.disabled = false;
                    // Reset file input visually
                    fileInput.value = '';
                    fileLabel.innerHTML = `📂 导入 Markdown 单词表文件<div style="font-size: 0.9rem; color: #94a3b8; margin-top: 0.5rem; font-weight: 400;">请选择文件 (支持 .md / .txt)</div>`;
                    fileLabel.style.borderColor = 'var(--text-muted)';
                }
            } else if (!fileInput.value) {
                uploadedVocab = [];
                btnGenerate.disabled = true;
            }
        });

        // File Parsing
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            fileLabel.innerHTML = `📂 已选择: <b>${file.name}</b>`;
            fileLabel.style.borderColor = 'var(--accent)';
            
            const reader = new FileReader();
            reader.onload = (event) => {
                parseMarkdown(event.target.result);
                if(uploadedVocab.length > 0) {
                    btnGenerate.disabled = false;
                    textInput.value = ''; // Clear textarea if file is used
                } else {
                    alert('未找到合适的单词格式，请确保文件包含类似 "- **word** meaning" 的行。');
                    btnGenerate.disabled = true;
                }
            };
            reader.readAsText(file);
        });

        function parseMarkdown(text) {
            const lines = text.split('\n');
            uploadedVocab = [];
            for (const line of lines) {
                if (line.trim().startsWith('- **')) {
                    const match = line.match(/^- \*\*(.*?)\*\*(?:\s*`([^`]+)`\s*)?(.*)$/);
                    if (match) {
                        uploadedVocab.push({ word: match[1].trim(), meaning: match[3].trim() });
                    } else {
                        const fallbackWord = line.replace(/^- \*\*/, '').split('**')[0];
                        uploadedVocab.push({ word: fallbackWord || line, meaning: line });
                    }
                }
            }
        }

        // Generate Story
        btnGenerate.addEventListener('click', async () => {
            if(!apiKeyInput.value.trim()) return alert("请输入 API Key");
            saveSettings();
            
            setupScreen.classList.remove('active');
            loadingScreen.classList.add('active');
            
            try {
                // Randomly pick a larger pool of words (e.g. 100) to give the AI choices
                const shuffled = [...uploadedVocab].sort(() => 0.5 - Math.random());
                const selectedPool = shuffled.slice(0, Math.min(100, shuffled.length));
                const vocabString = selectedPool.map(v => `${v.word} (${v.meaning})`).join(', ');
                
                const prompt = `You are an expert American English teacher writing a story for an English learner.
Here is a large pool of vocabulary words. Please CAREFULLY SELECT 10 to 15 words from this pool that share a common theme or natural correlation. 
Using your carefully selected 10-15 words, write a short, natural, conversational story or paragraph in American English.

CRITICAL INSTRUCTION:
Except for the 10-15 vocabulary words you selected from the pool, ALL OTHER WORDS in the story MUST BE extremely simple, basic, beginner-level English (CEFR A1/A2 level). 
Do NOT use any complex grammar or advanced words outside of the target vocabulary. The goal is to help the student focus ONLY on learning the target vocabulary without being distracted by difficult surrounding text.
The story must flow perfectly, logically, and sound like authentic spoken English.

Vocabulary pool:
${vocabString}

Return ONLY a valid JSON array containing the story broken down sentence by sentence. Do not include any markdown formatting like \`\`\`json.
Strict JSON format:
[
  {
    "sentence": "The quick brown fox jumps over the lazy dog.",
    "translation": "那只敏捷的棕色狐狸跃过了那只懒狗。",
    "vocab_used": [
      {"word": "fox", "meaning": "狐狸"},
      {"word": "lazy", "meaning": "懒惰的"}
    ]
  }
]`;

                const response = await fetch(`${apiBaseInput.value.trim()}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKeyInput.value.trim()}`
                    },
                    body: JSON.stringify({
                        model: apiModelInput.value.trim(),
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.7
                    })
                });
                
                if(!response.ok) {
                    const err = await response.text();
                    throw new Error(`API 请求失败: ${err}`);
                }
                
                const data = await response.json();
                let content = data.choices[0].message.content.trim();
                // Strip markdown blocks robustly
                content = content.replace(/^```[a-z]*\n?/i, '').replace(/\n?```$/i, '').trim();
                
                generatedStory = JSON.parse(content);
                currentIndex = 0;
                
                // Save to user's history
                const now = new Date();
                savedStories.unshift({
                    title: `AI 语境练习 (${uploadedVocab.length}词)`,
                    date: `${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`,
                    items: generatedStory,
                    progress: 0
                });
                saveStories();
                
                currentStoryIndex = 0;

                switchScreen('reader-screen');
                
                showCurrentSentence();
                
            } catch(e) {
                console.error(e);
                let msg = e.message;
                if(msg.includes("Failed to fetch")) {
                    msg += "\n\n💡 提示：这通常是因为网络问题或 API 不支持跨域请求 (CORS)。请检查你的代理，或确认 API 服务提供商。";
                } else if(msg.includes("not found") || msg.includes("does not exist") || msg.includes("V4 PRO")) {
                    msg += "\n\n💡 提示：模型不存在！如果你使用的是官方 DeepSeek API，请将模型名称改为 deepseek-chat";
                }
                alert("生成出错:\n" + msg);
                loadingScreen.classList.remove('active');
                setupScreen.classList.add('active');
            }
        });

        // TTS setup
        let availableVoices = [];
        function loadVoices() { availableVoices = window.speechSynthesis.getVoices(); }
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function showCurrentSentence() {
            if (currentStoryIndex !== -1 && savedStories[currentStoryIndex]) {
                savedStories[currentStoryIndex].progress = currentIndex;
                saveStories();
            }
            if(currentIndex >= generatedStory.length) {
                readerScreen.classList.remove('active');
                doneScreen.classList.add('active');
                return;
            }
            
            const item = generatedStory[currentIndex];
            progressText.textContent = `${currentIndex + 1} / ${generatedStory.length}`;
            
            // Highlight vocab in sentence
            let displayHTML = item.sentence;
            if(item.vocab_used && item.vocab_used.length > 0) {
                // Sort by length descending to prevent partial replacements
                const sortedVocab = [...item.vocab_used].sort((a,b) => b.word.length - a.word.length);
                sortedVocab.forEach(v => {
                    const regex = new RegExp(`\\b(${v.word})\\b`, 'gi');
                    displayHTML = displayHTML.replace(regex, `<span class="highlight-word" title="${v.meaning}">$1</span>`);
                });
            }
            sentenceText.innerHTML = displayHTML;
            sentenceTranslation.innerText = item.translation || '';
            
            // Show vocab list
            vocabListEl.innerHTML = '';
            if(item.vocab_used && item.vocab_used.length > 0) {
                item.vocab_used.forEach(v => {
                    const div = document.createElement('div');
                    div.className = 'vocab-item';
                    div.innerHTML = `
                        <div class="vocab-item-word">${v.word}</div>
                        <div class="vocab-item-meaning">${v.meaning}</div>
                    `;
                    vocabListEl.appendChild(div);
                });
            }
        }

        let isSpeaking = false;

        function readAndNext() {
            if (currentIndex >= generatedStory.length) return;
            
            const text = generatedStory[currentIndex].sentence;
            window.speechSynthesis.cancel(); 
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.70; // 进一步降低语速，使发音更慢、更清晰
            
            if (availableVoices.length === 0) loadVoices();
            
            // 优先选择高质量拟真声音 (如 macOS 的 Siri, Premium, Enhanced) 或 Google 原生美音
            let bestVoice = availableVoices.find(v => (v.name.includes('Siri') || v.name.includes('Premium') || v.name.includes('Enhanced')) && v.lang === 'en-US');
            if (!bestVoice) bestVoice = availableVoices.find(v => v.name === 'Google US English');
            if (!bestVoice) bestVoice = availableVoices.find(v => v.name === 'Samantha');
            if (!bestVoice) bestVoice = availableVoices.find(v => v.name === 'Alex');
            if (!bestVoice) bestVoice = availableVoices.find(v => v.lang === 'en-US');
            
            if (bestVoice) utterance.voice = bestVoice;
            
            utterance.onend = () => { isSpeaking = false; };
            isSpeaking = true;
            window.speechSynthesis.speak(utterance);
            
            // Move to next after triggering speech (Wait, the user said "按一下读一句话，再按一下读下一句")
            // So pressing Space reads CURRENT sentence, and automatically we should advance the index,
            // so NEXT Space reads the next sentence.
            currentIndex++;
            if(currentIndex < generatedStory.length) {
                // Pre-render the next sentence so the user sees what is being read OR what will be read next?
                // Actually, if we advance index, they see the NEXT sentence but hear the PREVIOUS one?
                // Better flow: Spacebar reads current, then we wait. If they press spacebar AGAIN, it cuts off, goes to next, reads next.
                // Let's just advance the UI immediately so they read along the NEW sentence, and speech plays the NEW sentence.
                showCurrentSentence();
            } else {
                showCurrentSentence(); // Shows Done screen
            }
        }

        document.addEventListener('keydown', (e) => {
            if (!readerScreen.classList.contains('active') && !doneScreen.classList.contains('active')) return;
            
            if (e.code === 'Space') {
                e.preventDefault();
                // If it's done screen, do nothing or restart
                if (doneScreen.classList.contains('active')) return;
                
                // Read CURRENT sentence, then immediately step UI to NEXT sentence to be ready for next press?
                // Wait, if UI steps to next sentence immediately, the voice is reading the PREVIOUS sentence while they look at the NEXT sentence. That's bad.
                // It should: Press Space -> reads CURRENT sentence. 
                // Press Space again -> cuts off current, advances UI to NEXT sentence, reads NEXT sentence.
                // Let's implement: 
                // First press: Reads index 0.
                // Next press: Moves to index 1, reads index 1.
                // How to distinguish? Just move first, then read.
                // Wait, initially they see index 0. Space should read index 0! 
                // Then space again should move to index 1 and read index 1.
            }
        });

        // Refined Spacebar logic
        let hasReadCurrent = false;
        document.addEventListener('keydown', (e) => {
            if (!readerScreen.classList.contains('active')) return;
            if (e.code === 'Space') {
                e.preventDefault();
                if (!hasReadCurrent) {
                    // First time pressing space on this sentence
                    playCurrentSentence();
                    hasReadCurrent = true;
                } else {
                    // Move to next and play
                    currentIndex++;
                    if (currentIndex < generatedStory.length) {
                        showCurrentSentence();
                        playCurrentSentence();
                    } else {
                        showCurrentSentence(); // Show done screen
                    }
                }
            } else if (e.key === 'ArrowLeft') {
                if (currentIndex > 0) {
                    currentIndex--;
                    showCurrentSentence();
                    playCurrentSentence();
                    hasReadCurrent = true;
                }
            }
        });

        function playCurrentSentence() {
            if (currentIndex >= generatedStory.length) return;
            const text = generatedStory[currentIndex].sentence;
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.0; 
            if (availableVoices.length === 0) loadVoices();
            let bestVoice = availableVoices.find(v => v.name === 'Samantha' || v.name === 'Alex' || v.name === 'Google US English');
            if (!bestVoice) bestVoice = availableVoices.find(v => v.lang === 'en-US');
            if (bestVoice) utterance.voice = bestVoice;
            window.speechSynthesis.speak(utterance);
        }

    </script>
</body>
</html>
