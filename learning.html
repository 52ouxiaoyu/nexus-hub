<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习天地 - Learning Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --card-radius: 32px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo-title {
            font-family: 'Outfit', sans-serif;
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            width: 100%;
        }

        .portal-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: var(--card-radius);
            padding: 60px 40px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .portal-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        .card-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .card-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Float Back to Hub */
        .float-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .float-back:hover {
            background: rgba(255,255,255,0.2);
        }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="float-back">⬅️ 返回总站首页</a>

    <div class="container">
        <header>
            <h1 class="logo-title">学习天地</h1>
            <div style="color: var(--text-muted); font-size: 18px;">Learning Hub</div>
        </header>

        <div class="cards-grid">
            <a href="VocabSwipe.html" class="portal-card">
                <div class="card-icon">⚡️</div>
                <h2 class="card-title">极速词汇过滤</h2>
                <p class="card-desc">Tinder 风格背词法。快速左滑右滑，剔除已掌握单词，找出生词盲区。</p>
            </a>

            <a href="StoryReader.html" class="portal-card">
                <div class="card-icon">🤖</div>
                <h2 class="card-title">AI 语境阅读器</h2>
                <p class="card-desc">基于你导入的单词表，AI 自动创作纯正美式口语短文，结合 TTS 原声带读。</p>
            </a>

            <a href="english_game.html" class="portal-card">
                <div class="card-icon">🎓</div>
                <h2 class="card-title">六年级英语闯关</h2>
                <p class="card-desc">六年级上册专属陪练。内置全套课文重点与智能语音跟读，帮你轻松拿下暑期预习。</p>
            </a>

            <a href="custom_reader.html" class="portal-card">
                <div class="card-icon">📖</div>
                <h2 class="card-title">自定义文章跟读</h2>
                <p class="card-desc">导入任何你喜欢的文章！AI自动拆句翻译，支持多账号隔离存档与强制通关模式。</p>
            </a>

            <a href="huaziazi/index.html" class="portal-card">
                <div class="card-icon">💬</div>
                <h2 class="card-title">话匣子 · 亲子聊天</h2>
                <p class="card-desc">3-18 岁专属聊天话题库，1200+ 话题覆盖 12 大能力维度，抽一题和孩子好好聊聊。</p>
            </a>
        </div>
    </div>
</body>
</html>
