<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>葫芦兄弟：拯救爷爷</title>
<style>
/* ============ 基础 ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body {
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#f5f0e4; color:#2d2a26; overflow:hidden;
}
#app { width:100vw; height:100vh; display:flex; flex-direction:column; position:relative; overflow:hidden; }
/* 宣纸质感 + 远山水墨水印 */
#app::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1000px 500px at 90% 110%, rgba(210,180,120,.12), transparent 60%);
}
#watermark { position:absolute; bottom:0; left:0; width:100%; height:38%; pointer-events:none; opacity:.07; }

.screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:24px; overflow:auto; }
.screen.active { display:flex; }

/* ============ 通用组件 ============ */
.btn {
  font-family:inherit; font-size:17px; font-weight:600; letter-spacing:2px;
  background:#2d2a26; color:#f5f0e4; border:none; border-radius:10px;
  padding:14px 38px; cursor:pointer; transition:transform .15s, box-shadow .15s;
  box-shadow:0 4px 14px rgba(45,42,38,.25);
}
.btn:hover { transform:translateY(-2px); box-shadow:0 7px 18px rgba(45,42,38,.3); }
.btn:active { transform:translateY(0); }
.btn.ghost { background:transparent; color:#2d2a26; border:1.5px solid #b9b19d; box-shadow:none; }
.btn.small { font-size:14px; padding:8px 20px; letter-spacing:1px; }
.btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }

.chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
  background:rgba(45,42,38,.08); color:#6b6455; border-radius:99px; padding:3px 12px; }

.title-main { font-size:64px; font-weight:900; letter-spacing:14px; text-indent:14px; line-height:1.2;
  background:linear-gradient(135deg,#b8322a 0%, #d69e2e 35%, #38a169 62%, #3182ce 85%, #805ad5 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.subtitle { font-size:20px; letter-spacing:8px; text-indent:8px; color:#8a8371; margin-top:10px; font-weight:600; }
.ver-chip { font-size:12px; font-weight:700; color:#fff; background:#38a169; border-radius:6px; padding:2px 9px; vertical-align:middle; letter-spacing:1px; }

.seven-dots { display:flex; gap:14px; margin:30px 0 40px; }
.seven-dots i { width:16px; height:16px; border-radius:50%; box-shadow:0 2px 6px rgba(0,0,0,.15); }

.panel { background:#fffdf7; border:1.5px solid #e2dbc8; border-radius:16px;
  box-shadow:0 10px 30px rgba(120,100,60,.12); }

h2.sec { font-size:24px; font-weight:800; letter-spacing:6px; margin-bottom:6px; }
p.hint { color:#8a8371; font-size:14px; letter-spacing:1px; }

/* ============ 选人界面 ============ */
.char-grid { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; max-width:1050px; margin-top:26px; }
.char-card { width:170px; padding:20px 14px 16px; text-align:center; cursor:pointer; transition:all .2s; position:relative; }
.char-card:hover { transform:translateY(-6px); box-shadow:0 16px 34px rgba(120,100,60,.22); }
.char-avatar { width:58px; height:58px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center;
  font-size:26px; font-weight:900; color:#fff; box-shadow:inset 0 -8px 14px rgba(0,0,0,.18), 0 4px 10px rgba(0,0,0,.15); }
.char-name { font-size:19px; font-weight:800; letter-spacing:3px; }
.char-passive { font-size:12.5px; color:#6b6455; margin-top:8px; line-height:1.65; min-height:52px; }
.char-sig { margin-top:8px; display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }
.char-sig span { font-size:11px; padding:2px 8px; border-radius:6px; background:rgba(45,42,38,.06); color:#6b6455; }

/* ============ 顶栏 ============ */
#topbar { position:absolute; top:0; left:0; right:0; height:54px; display:none; align-items:center;
  padding:0 22px; gap:14px; z-index:20; background:rgba(245,240,228,.85); backdrop-filter:blur(6px);
  border-bottom:1px solid #e2dbc8; }
#topbar.on { display:flex; }
#topbar .chapter-label { font-weight:800; letter-spacing:2px; font-size:15px; }
#topbar .spacer { flex:1; }
#hp-mini { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; }
#hp-mini .bar { width:130px; height:10px; background:#e2dbc8; border-radius:99px; overflow:hidden; }
#hp-mini .bar i { display:block; height:100%; background:linear-gradient(90deg,#e05a4e,#c0392b); border-radius:99px; transition:width .3s; }
#mute-btn { border:none; background:none; font-size:17px; cursor:pointer; opacity:.65; }
#mute-btn:hover { opacity:1; }

/* ============ 地图 ============ */
.map-wrap { display:flex; flex-direction:column; align-items:center; gap:30px; max-width:900px; width:100%; }
.chapter-banner { text-align:center; }
.chapter-banner .no { font-size:13px; letter-spacing:5px; color:#a89e85; font-weight:700; }
.chapter-banner .name { font-size:34px; font-weight:900; letter-spacing:10px; margin-top:4px; }
.chapter-banner .story { font-size:14px; color:#8a8371; margin-top:8px; letter-spacing:1px; }
.node-track { display:flex; align-items:center; justify-content:center; width:100%; margin:14px 0 6px; }
.node { width:66px; height:66px; border-radius:50%; background:#fffdf7; border:2px solid #d8d0ba;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  font-size:22px; cursor:default; transition:all .2s; position:relative; flex-shrink:0;
  box-shadow:0 4px 10px rgba(120,100,60,.1); }
.node .nl { font-size:10.5px; color:#8a8371; font-weight:600; letter-spacing:1px; }
.node.done { background:#efe8d5; border-color:#c9c0a6; opacity:.65; }
.node.done::after { content:'✓'; position:absolute; top:-4px; right:-4px; width:20px; height:20px; border-radius:50%;
  background:#38a169; color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; }
.node.cur { border-color:#b8322a; border-width:2.5px; cursor:pointer; transform:scale(1.12);
  box-shadow:0 6px 18px rgba(184,50,42,.25); animation:pulse 1.6s infinite; }
.node.cur:hover { transform:scale(1.2); }
@keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(184,50,42,.3);} 50%{ box-shadow:0 0 0 12px rgba(184,50,42,0);} }
.node-link { width:52px; height:2px; background:#d8d0ba; flex-shrink:0; }
.player-strip { display:flex; gap:12px; align-items:center; margin-top:16px; flex-wrap:wrap; justify-content:center; }
.player-strip .chip b { color:#2d2a26; }
.bro-dots { display:flex; gap:5px; align-items:center; }
.bro-dots i { width:13px; height:13px; border-radius:50%; opacity:.22; }
.bro-dots i.got { opacity:1; box-shadow:0 1px 4px rgba(0,0,0,.2); }

/* ============ 战斗 ============ */
#screen-combat { justify-content:flex-start; padding:66px 24px 14px; }
.combat-head { text-align:center; margin-bottom:4px; min-height:26px; }
#combat-log { font-size:14px; color:#6b6455; letter-spacing:.5px; }
.enemy-zone { display:flex; gap:46px; justify-content:center; align-items:flex-start; margin:12px 0 4px; min-height:190px; }
.enemy { position:relative; display:flex; flex-direction:column; align-items:center; width:150px; }
.intent { background:#fffdf7; border:1.5px solid #e2dbc8; border-radius:99px; padding:4px 14px; font-size:13px; font-weight:700;
  box-shadow:0 3px 8px rgba(120,100,60,.12); margin-bottom:10px; display:flex; gap:6px; align-items:center; white-space:nowrap; }
.intent.atk { color:#c0392b; } .intent.def { color:#2a9d8f; } .intent.buf { color:#d69e2e; } .intent.deb { color:#805ad5; }
.enemy-body { width:104px; height:104px; border-radius:50%; background:linear-gradient(160deg,#fffdf7,#f0e9d8);
  border:2px solid #d8d0ba; display:flex; align-items:center; justify-content:center; font-size:48px;
  box-shadow:0 6px 16px rgba(120,100,60,.16); transition:transform .12s; position:relative; }
.enemy.hurt .enemy-body { transform:scale(.92); filter:brightness(.85); }
.enemy.dead { opacity:0; transform:scale(.5); pointer-events:none; transition:all .5s; }
.enemy-name { font-size:14px; font-weight:800; margin-top:8px; letter-spacing:2px; }
.enemy-hp { width:100px; height:8px; background:#e2dbc8; border-radius:99px; overflow:hidden; margin-top:5px; }
.enemy-hp i { display:block; height:100%; background:linear-gradient(90deg,#e05a4e,#c0392b); transition:width .3s; }
.enemy-sub { font-size:11.5px; color:#8a8371; margin-top:3px; display:flex; gap:6px; align-items:center; }
.enemy-sub .blk { color:#2a9d8f; font-weight:700; }
.status-tag { font-size:10.5px; font-weight:700; border-radius:5px; padding:1px 6px; }
.status-tag.str { background:rgba(214,158,46,.18); color:#a3651a; }
.status-tag.weak { background:rgba(128,90,213,.15); color:#6b46a8; }
.status-tag.vuln { background:rgba(192,57,43,.13); color:#b03a2e; }

.player-zone { margin-top:auto; width:100%; max-width:1060px; }
.stat-row { display:flex; align-items:center; gap:18px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; }
.stat-row .chip { font-size:13px; padding:5px 16px; }
.energy-orbs { display:flex; gap:8px; }
.energy-orbs i { width:24px; height:24px; border-radius:50%; background:#e2dbc8; position:relative; }
.energy-orbs i.full { background:radial-gradient(circle at 35% 30%, #ffd76e, #d69e2e); box-shadow:0 2px 6px rgba(214,158,46,.5); }

.hand { display:flex; justify-content:center; align-items:flex-end; min-height:212px; padding-bottom:6px; }
.card { width:150px; height:196px; background:#fffdf7; border:1.5px solid #ddd5c1; border-radius:13px;
  padding:12px 12px 10px; cursor:pointer; position:relative; flex-shrink:0;
  box-shadow:0 5px 14px rgba(120,100,60,.16); transition:transform .18s, box-shadow .18s;
  display:flex; flex-direction:column; }
.card:hover { transform:translateY(-18px) !important; box-shadow:0 14px 28px rgba(120,100,60,.28); z-index:5; }
.card .cost { position:absolute; top:-9px; left:-9px; width:30px; height:30px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffd76e, #d69e2e); color:#fff; font-weight:900; font-size:15px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.25); }
.card .cname { font-size:15.5px; font-weight:800; letter-spacing:1px; margin-top:4px; }
.card .ctype { font-size:10.5px; font-weight:700; letter-spacing:2px; margin-top:2px; }
.card.attack .ctype { color:#c0392b; } .card.skill .ctype { color:#2a9d8f; } .card.power .ctype { color:#805ad5; }
.card .cdesc { font-size:12.5px; line-height:1.7; color:#5a544a; margin-top:8px; flex:1; }
.card .cbar { height:4px; border-radius:99px; margin-top:6px; }
.card.disabled { opacity:.5; filter:grayscale(.7); cursor:not-allowed; }
.card.exhaust-mark::after { content:'消耗'; position:absolute; top:8px; right:8px; font-size:10px; color:#b03a2e; font-weight:700;
  border:1px solid rgba(176,58,46,.4); border-radius:5px; padding:0 4px; }
.combat-actions { display:flex; align-items:center; justify-content:center; gap:26px; margin-top:2px; }
.pile-chip { font-size:12.5px; color:#8a8371; font-weight:600; }

/* 飘字 */
.float-txt { position:absolute; font-size:22px; font-weight:900; pointer-events:none; z-index:50;
  animation:floatUp 1s forwards; text-shadow:0 2px 6px rgba(0,0,0,.18); }
@keyframes floatUp { 0%{opacity:0; transform:translateY(6px) scale(.8);} 15%{opacity:1; transform:translateY(0) scale(1.15);}
  100%{opacity:0; transform:translateY(-46px) scale(1);} }

/* ============ 事件 / 奖励 / 结局 ============ */
.story-card { max-width:560px; width:100%; padding:38px 42px; text-align:center; }
.story-card .ev-title { font-size:23px; font-weight:900; letter-spacing:4px; margin-bottom:14px; }
.story-card .ev-text { font-size:15.5px; line-height:2; color:#5a544a; margin-bottom:26px; white-space:pre-line; }
.ev-choices { display:flex; flex-direction:column; gap:12px; }
.choice-btn { font-family:inherit; font-size:15px; font-weight:600; padding:13px 20px; border-radius:10px;
  background:#faf6ec; border:1.5px solid #ddd5c1; color:#2d2a26; cursor:pointer; transition:all .15s; letter-spacing:1px; }
.choice-btn:hover { border-color:#b8322a; background:#fff; transform:translateY(-2px); box-shadow:0 6px 14px rgba(120,100,60,.14); }

.reward-grid { display:flex; gap:22px; margin:28px 0 22px; flex-wrap:wrap; justify-content:center; }
.reward-grid .card { transform:scale(1.04); }
.reward-grid .card:hover { transform:scale(1.04) translateY(-14px) !important; }
.reward-grid .card.taken { outline:3px solid #38a169; }

.bro-choice { display:flex; gap:22px; margin-top:24px; flex-wrap:wrap; justify-content:center; }
.bro-choice .char-card { width:210px; }

.end-title { font-size:46px; font-weight:900; letter-spacing:10px; margin-bottom:14px; }
.end-sub { font-size:16px; color:#6b6455; line-height:2; text-align:center; white-space:pre-line; margin-bottom:30px; }
.end-stats { display:flex; gap:14px; margin-bottom:34px; flex-wrap:wrap; justify-content:center; }
.end-stats .chip { font-size:13px; padding:6px 18px; }

/* 转场横幅 */
#banner { position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:60;
  background:rgba(45,42,38,.55); backdrop-filter:blur(3px); }
#banner.on { display:flex; }
#banner .b-txt { font-size:34px; font-weight:900; letter-spacing:8px; color:#fff; text-align:center; line-height:1.9; animation:bannerIn .5s; }
@keyframes bannerIn { from{opacity:0; transform:scale(1.15);} to{opacity:1; transform:scale(1);} }

@media (max-width:900px){
  .title-main { font-size:42px; letter-spacing:8px; }
  .char-card { width:140px; }
  .node { width:52px; height:52px; font-size:18px; } .node-link { width:30px; }
  .card { width:126px; height:172px; } .hand { min-height:184px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- 远山水墨水印 -->
  <svg id="watermark" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
    <path d="M0,300 L0,220 Q120,120 240,200 T480,170 Q600,80 720,180 T960,150 Q1080,100 1200,190 L1200,300 Z" fill="#2d2a26"/>
    <path d="M0,300 L0,260 Q180,190 360,250 T720,235 Q900,180 1200,250 L1200,300 Z" fill="#2d2a26" opacity=".55"/>
  </svg>

  <!-- 顶栏 -->
  <div id="topbar">
    <span class="chapter-label" id="tb-chapter"></span>
    <span class="chip" id="tb-node"></span>
    <span class="spacer"></span>
    <div id="hp-mini"><span>❤</span><div class="bar"><i id="tb-hpfill"></i></div><span id="tb-hptext"></span></div>
    <span class="chip ver-chip" id="tb-ver"></span>
    <button id="mute-btn" title="静音 (M)">🔊</button>
  </div>

  <!-- 标题 -->
  <section class="screen active" id="screen-title">
    <div class="title-main">葫芦兄弟</div>
    <div class="subtitle">拯 救 爷 爷 <span class="ver-chip" id="title-ver"></span></div>
    <div class="seven-dots" id="title-dots"></div>
    <button class="btn" id="btn-start">开 始 冒 险</button>
    <p class="hint" style="margin-top:22px;">选择一位葫芦娃 · 三章闯关 · 救出兄弟 · 集齐七子，唤醒金刚葫芦娃</p>
    <p class="hint" style="margin-top:8px;">快捷键：1-8 出牌 · E 结束回合 · M 静音</p>
  </section>

  <!-- 选人 -->
  <section class="screen" id="screen-select">
    <h2 class="sec">选择你的葫芦娃</h2>
    <p class="hint">每位兄弟都有专属卡组与被动天赋</p>
    <div class="char-grid" id="char-grid"></div>
  </section>

  <!-- 地图 -->
  <section class="screen" id="screen-map">
    <div class="map-wrap">
      <div class="chapter-banner">
        <div class="no" id="map-no"></div>
        <div class="name" id="map-name"></div>
        <div class="story" id="map-story"></div>
      </div>
      <div class="node-track" id="node-track"></div>
      <button class="btn" id="btn-enter">前 往</button>
      <div class="player-strip" id="player-strip"></div>
    </div>
  </section>

  <!-- 战斗 -->
  <section class="screen" id="screen-combat">
    <div class="combat-head"><div id="combat-log"></div></div>
    <div class="enemy-zone" id="enemy-zone"></div>
    <div class="player-zone">
      <div class="stat-row" id="player-stats"></div>
      <div class="hand" id="hand"></div>
      <div class="combat-actions">
        <span class="pile-chip" id="draw-pile"></span>
        <button class="btn small" id="btn-endturn">结束回合 (E)</button>
        <span class="pile-chip" id="discard-pile"></span>
      </div>
    </div>
  </section>

  <!-- 通用故事面板（事件/休整/兄弟/结局前的横幅都走这里） -->
  <section class="screen" id="screen-story">
    <div class="panel story-card">
      <div class="ev-title" id="ev-title"></div>
      <div class="ev-text" id="ev-text"></div>
      <div class="ev-choices" id="ev-choices"></div>
      <div class="ev-choices" id="ev-extra" style="margin-top:18px;"></div>
    </div>
  </section>

  <!-- 卡牌奖励 -->
  <section class="screen" id="screen-reward">
    <h2 class="sec">战利品 · 选择一张卡牌</h2>
    <p class="hint">也可放弃，保持卡组精炼</p>
    <div class="reward-grid" id="reward-grid"></div>
    <button class="btn ghost small" id="btn-skip-reward">放 弃</button>
  </section>

  <!-- 结局 -->
  <section class="screen" id="screen-end">
    <div class="end-title" id="end-title"></div>
    <div class="end-sub" id="end-sub"></div>
    <div class="end-stats" id="end-stats"></div>
    <button class="btn" id="btn-restart">再 来 一 局</button>
  </section>

  <div id="banner"><div class="b-txt" id="banner-txt"></div></div>
</div>

<script>
'use strict';
/* =====================================================
   葫芦兄弟：拯救爷爷 v2.0 重制版
   架构：DATA(数据) → SFX(音效) → ENGINE(状态机+战斗) → UI(渲染)
   ===================================================== */
const VERSION = '2.0.0';

/* ---------------- 音效（WebAudio 合成） ---------------- */
const SFX = {
  ctx:null, muted:false,
  ensure(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },
  tone(f, dur, type='sine', vol=0.12, slideTo){
    if(this.muted) return; this.ensure(); if(!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+dur);
  },
  click(){ this.tone(660, .06, 'triangle', .07); },
  card(){ this.tone(520, .07, 'triangle', .09); },
  attack(){ this.tone(180, .16, 'square', .1, 60); },
  block(){ this.tone(920, .1, 'square', .08); this.tone(620, .12, 'triangle', .07); },
  hurt(){ this.tone(160, .28, 'sawtooth', .12, 55); },
  heal(){ this.tone(520, .12, 'sine', .1); setTimeout(()=>this.tone(780, .16, 'sine', .1), 90); },
  buff(){ this.tone(440, .1, 'triangle', .09); setTimeout(()=>this.tone(660, .14, 'triangle', .09), 80); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,.18,'triangle',.11), i*110)); },
  lose(){ [392,330,262,196].forEach((f,i)=>setTimeout(()=>this.tone(f,.24,'sine',.11), i*160)); },
  transform(){ [262,392,523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>this.tone(f,.2,'triangle',.1), i*100)); }
};

/* ---------------- 数据：七位葫芦娃 ---------------- */
const BROTHERS = [
  { id:'dawa',  name:'大娃', num:'大', color:'#c0392b', passive:'力大无穷：每场战斗开始时力量 +1', sig:['smash','uproot'] },

function genNodes(ch){

}
const NODE_INFO = {

};

/* ---------- 工具 ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function healPlayer(n){ run.hp = Math.min(run.maxHp, run.hp + n); syncTopbar(); }
function damagePlayerDirect(n){ run.hp = Math.max(1, run.hp - n); syncTopbar(); } // 事件伤害不致死
function addRandomPoolCard(){ const c = pick(REWARD_POOL); run.deck.push(c); return c; }
function aliveEnemies(){ return combat.enemies.filter(e=>e.hp>0); }

/* ---------- 屏幕切换 ---------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('topbar').classList.toggle('on', ['screen-map','screen-combat','screen-story','screen-reward'].includes(id));
}
function banner(text, cb, ms=1400){
  const b = document.getElementById('banner');
  document.getElementById('banner-txt').innerHTML = text;
  b.classList.add('on');
  setTimeout(()=>{ b.classList.remove('on'); if(cb) cb(); }, ms);
}
function syncTopbar(){
  const ch = CHAPTERS[run.chapter];
  document.getElementById('tb-chapter').textContent = ch.no + ' · ' + ch.name;
  document.getElementById('tb-node').textContent = '第 ' + (run.node+1) + ' / 6 节点';
  document.getElementById('tb-hpfill').style.width = Math.max(0, run.hp/run.maxHp*100) + '%';
  document.getElementById('tb-hptext').textContent = Math.max(0,Math.round(run.hp)) + '/' + run.maxHp;
}

/* =====================================================
   地图
   ===================================================== */
function completeNode(){ run.node++; showMap(); }

function showMap(){
  const ch = CHAPTERS[run.chapter];
  document.getElementById('map-no').textContent = ch.no;
  document.getElementById('map-name').textContent = ch.name;
  document.getElementById('map-story').textContent = ch.story;
  const track = document.getElementById('node-track');
  track.innerHTML = '';
  run.nodes.forEach((t,i)=>{
    const el = document.createElement('div');
    el.className = 'node' + (i<run.node?' done': i===run.node?' cur':'');
    el.innerHTML = '<div>'+NODE_INFO[t].icon+'</div><div class="nl">'+NODE_INFO[t].label+'</div>';
    if(i===run.node) el.onclick = enterNode;
    track.appendChild(el);
    if(i<run.nodes.length-1){ const l=document.createElement('div'); l.className='node-link'; track.appendChild(l); }
  });
  document.getElementById('btn-enter').onclick = enterNode;
  /* 玩家信息条 */
  const strip = document.getElementById('player-strip');
  strip.innerHTML = '';
  const hpChip = document.createElement('span'); hpChip.className='chip';
  hpChip.innerHTML = '❤ 生命 <b>'+Math.max(0,Math.round(run.hp))+'</b> / '+run.maxHp;
  const deckChip = document.createElement('span'); deckChip.className='chip';
  deckChip.innerHTML = '🂠 卡组 <b>'+run.deck.length+'</b> 张';
  const energyChip = document.createElement('span'); energyChip.className='chip';
  energyChip.innerHTML = '✦ 能量上限 <b>'+run.energy+'</b>';
  const broWrap = document.createElement('span'); broWrap.className='chip bro-dots';
  broWrap.innerHTML = '兄弟 ';
  BROTHERS.forEach(b=>{ const d=document.createElement('i'); d.style.background=b.color; if(run.brothers.includes(b.id)) d.classList.add('got'); broWrap.appendChild(d); });
  strip.append(hpChip, deckChip, energyChip, broWrap);
  syncTopbar();
  showScreen('screen-map');
}

function enterNode(){
  const t = run.nodes[run.node];
  SFX.click();
  if(t==='fight' || t==='elite' || t==='boss') startCombat(t);
  else if(t==='event') showEvent();
  else if(t==='rest') showRest();
}

function showEvent(){
  const ev = pick(EVENTS);

}
function showStory(title, text, choices){
  document.getElementById('ev-title').textContent = title;
  document.getElementById('ev-text').textContent = text;
  const box = document.getElementById('ev-choices'); box.innerHTML='';
  const extra = document.getElementById('ev-extra'); extra.innerHTML=''; extra.style.display='none';
  choices.forEach(c=>{
    const b = document.createElement('button'); b.className='choice-btn'; b.textContent = c.label;
    b.onclick = ()=>{ SFX.click(); const f = c.fn || c.act; f ? f() : (c.next==='map' && completeNode()); };
    box.appendChild(b);
  });
  syncTopbar();
  showScreen('screen-story');
}

/* 移除卡牌流程：先在本面板列出卡组供点击，完成后回调展示 */
function startRemoveFlow(doneText){
  const box = document.getElementById('ev-choices'); box.innerHTML='';
  const extra = document.getElementById('ev-extra');
  document.getElementById('ev-text').textContent = '点击要移除的卡牌：';
  extra.style.display='flex';
  run.deck.forEach((cid, idx)=>{
    const b = document.createElement('button'); b.className='choice-btn';
    b.textContent = CARDS[cid].name;
    b.onclick = ()=>{
      run.deck.splice(idx,1); SFX.card();
      showStory('去芜存菁', doneText, [{label:'继续前行', next:'map'}]);
    };
    extra.appendChild(b);
  });
  const cancel = document.createElement('button'); cancel.className='choice-btn'; cancel.textContent='再想想';
  cancel.onclick = ()=>{ extra.innerHTML=''; extra.style.display='none'; showRest(); };
  box.appendChild(cancel);
}

/* =====================================================
   战斗引擎
   ===================================================== */
function makeEnemy(id){
  const d = ENEMIES[id];
  return { id, name:d.name, emoji:d.emoji, boss:!!d.boss, maxHp:d.hp, hp:d.hp,
    block:0, str:0, vuln:0, weak:0, ai:d.ai, moves:d.moves, turnCount:0, pending:null };
}

function startCombat(kind){
  const ch = CHAPTERS[run.chapter];
  let ids;
  if(kind==='boss') ids = ch.boss;
  else if(kind==='elite') ids = pick(ch.elite);
  else ids = pick(ch.fights);
  combat = {
    kind, enemies: ids.map(makeEnemy),
    draw: shuffle(run.deck.slice()), discard:[], hand:[],
    playerBlock:0, playerStr:0, playerVuln:0, playerWeak:0,
    turn:0, over:false,
  };
  /* 被动：大娃 */
  if(run.brother==='dawa') combat.playerStr += 1;
  if(run.brother==='sanwa') combat.playerBlock += 6;
  run.stats.turns++;
  startPlayerTurn(true);
  if(kind==='boss') SFX.buff();
  showScreen('screen-combat');
  renderCombat();
  log('遭遇 ' + combat.enemies.map(e=>e.name).join('、') + '！');
}

function startPlayerTurn(first){
  combat.turn++;
  combat.playerBlock = first ? combat.playerBlock : 0;
  combat.playerVuln = Math.max(0, combat.playerVuln - 0); // 玩家易伤在自己回合结束结算
  if(run.brother==='wuwa' && run.hp < run.maxHp){ run.hp = Math.min(run.maxHp, run.hp+2); }
  /* 抽牌 */
  const n = 5 + (run.brother==='erwa' ? 1 : 0);
  drawCards(n);
  /* 七娃：宝葫芦置入手牌 */
  if(run.brother==='qiwa' && combat.turn===1){ combat.hand.push('gourd'); }
  decideIntents(); // 敌人意图只在玩家回合开始时决定一次
  renderCombat();
}
function drawCards(n){
  for(let i=0;i<n;i++){
    if(combat.hand.length>=9) break;
    if(combat.draw.length===0){
      if(combat.discard.length===0) break;
      combat.draw = shuffle(combat.discard); combat.discard=[];
    }
    combat.hand.push(combat.draw.pop());
  }
}

/* 伤害计算：src/target 拥有 str/weak/vuln 字段 */
function calcDmg(base, src, tgt, isAttackCard){
  let d = base + (src.str||0);
  if(src.weak>0) d = Math.floor(d*0.75);
  if(tgt.vuln>0) d = Math.floor(d*1.5);
  if(isAttackCard && run.brother==='siwa') d = Math.floor(d*1.15);
  return Math.max(0, d);
}
function dealToPlayer(raw, src, opts={}){
  /* 六娃闪避（仅攻击类） */
  if(!opts.pierce && run.brother==='liuwa' && Math.random()<0.12){
    log('六娃的隐身术让你闪过了攻击！'); floatOn('.enemy-zone','闪避!','#3182ce'); SFX.block();
    return;
  }
  let d = raw;
  if(combat.playerBlock>0){
    const absorbed = Math.min(combat.playerBlock, d);
    combat.playerBlock -= absorbed; d -= absorbed;
    if(absorbed>0){ SFX.block(); floatOn('#player-stats','格挡 '+absorbed,'#2a9d8f'); }
  }
  if(d>0){ run.hp -= d; SFX.hurt(); floatOn('#player-stats','-'+d,'#c0392b'); }
  syncTopbar();
  if(run.hp<=0){ combat.over=true; setTimeout(gameOver, 700); }
}
function dealToEnemy(e, raw, src){
  let d = raw;
  if(e.block>0){ const ab=Math.min(e.block,d); e.block-=ab; d-=ab; if(ab>0) floatOnEnemy(e,'格挡 '+ab,'#2a9d8f'); }
  if(d>0){ e.hp -= d; floatOnEnemy(e,'-'+d,'#c0392b'); bumpEnemy(e); SFX.attack(); }
  if(e.hp<=0){ run.stats.kills++; log(e.name+' 被击败了！'); }
}

/* ---------- 出牌 ---------- */
function canPlay(cid){ return CARDS[cid].cost <= run.energy; }

function playCard(handIdx){
  if(busy || combat.over) return;
  const cid = combat.hand[handIdx]; if(!cid) return;
  const c = CARDS[cid];
  if(!canPlay(cid)){ log('能量不足！'); return; }
  busy = true;
  run.energy -= c.cost;
  run.stats.cardsPlayed++;
  combat.hand.splice(handIdx,1);
  if(!c.exhaust) combat.discard.push(cid);
  SFX.card();

  const targets = aliveEnemies();
  const main = targets.sort((a,b)=>a.hp-b.hp)[0]; // 优先残血
  const atkSrc = { str:combat.playerStr, weak:combat.playerWeak };

  /* 单体攻击（含多段） */
  if(c.dmg && main){
    const base = (main.weak>0 && c.vsWeak) ? c.vsWeak : c.dmg;
    const hits = c.hits || 1;
    for(let i=0;i<hits;i++){
      const d = calcDmg(base, atkSrc, main, true);
      dealToEnemy(main, d, atkSrc);
    }
  }
  /* 全体攻击 */
  if(c.dmgAll){
    targets.forEach(e=>{
      const d = calcDmg(c.dmgAll, atkSrc, e, true);
      dealToEnemy(e, d, atkSrc);
    });
  }
  if(c.block){ combat.playerBlock += c.block; SFX.block(); floatOn('#player-stats','格挡 +'+c.block,'#2a9d8f'); }
  if(c.heal){ healPlayer(c.heal); SFX.heal(); floatOn('#player-stats','+'+c.heal,'#38a169'); }
  if(c.self){ run.hp -= c.self; floatOn('#player-stats','-'+c.self,'#c0392b'); }
  if(c.draw){ drawCards(c.draw); }
  if(c.str){ combat.playerStr += c.str; SFX.buff(); floatOn('#player-stats','力量 +'+c.str,'#d69e2e'); }
  if(c.vuln && main){ main.vuln += c.vuln; floatOnEnemy(main,'易伤 +'+c.vuln,'#805ad5'); }

  renderCombat();
  if(c.self && run.hp<=0){ combat.over=true; setTimeout(gameOver,700); busy=false; return; }
  if(checkWin()) { busy=false; return; }
  setTimeout(()=>{ busy=false; renderCombat(); }, 150);
}

function checkWin(){
  if(combat.over) return false;
  if(aliveEnemies().length===0){
    combat.over = true;
    log('战斗胜利！');
    SFX.win();
    setTimeout(winCombat, 900);
    return true;
  }
  return false;
}

/* ---------- 回合结束 / 敌人行动 ---------- */
function endTurn(){
  if(busy || combat.over) return;
  busy = true;
  /* 玩家状态衰减 */
  combat.playerVuln = Math.max(0, combat.playerVuln-1);
  combat.playerWeak = Math.max(0, combat.playerWeak-1);
  combat.discard.push(...combat.hand); combat.hand=[];
  renderCombat();
  enemyPhase();
}
function enemyPhase(){
  const list = aliveEnemies();
  let i = 0;
  const step = ()=>{
    if(combat.over){ busy=false; return; }
    if(i>=list.length){ 
      combat.enemies.forEach(e=>{ e.vuln=Math.max(0,e.vuln-1); e.weak=Math.max(0,e.weak-1); });
      run.energy = 3;
      startPlayerTurn(false);
      busy = false; renderCombat(); return;
    }
    const e = list[i++];
    e.turnCount++;
    if(e.hp<=0){ step(); return; }
    e.vuln = Math.max(0, e.vuln-1); e.weak = Math.max(0, e.weak-1);
    const mv = e.pending;
    if(!mv){ step(); return; }
    if(mv.t==='atk'){
      const hits = mv.hits || 1;
      for(let h=0; h<hits; h++){
        const d = calcDmg(mv.v, e, {vuln:combat.playerVuln}, false);
        dealToPlayer(d, e);
        if(combat.over){ busy=false; return; }
      }
      if(mv.weak){ combat.playerWeak += mv.weak; floatOn('#player-stats','虚弱 +'+mv.weak,'#805ad5'); }
      if(mv.vuln){ combat.playerVuln += mv.vuln; floatOn('#player-stats','易伤 +'+mv.vuln,'#b03a2e'); }
    } else if(mv.t==='block'){
      e.block += mv.v; floatOnEnemy(e,'格挡 +'+mv.v,'#2a9d8f'); SFX.block();
    } else if(mv.t==='buff'){
      e.str += mv.str; floatOnEnemy(e,'力量 +'+mv.str,'#d69e2e'); SFX.buff();
    } else if(mv.t==='heal'){
      e.hp = Math.min(e.maxHp, e.hp+mv.heal); floatOnEnemy(e,'+'+mv.heal,'#38a169');
    }
    renderCombat();
    setTimeout(step, 420);
  };
  setTimeout(step, 350);
}

/* 敌人意图：在玩家回合开始时确定并展示 */
function decideIntents(){
  combat.enemies.forEach(e=>{
    if(e.hp<=0){ e.pending=null; return; }
    let idx;
    if(typeof e.ai==='function') idx = e.ai(e, e.turnCount);
    else idx = e.ai[e.turnCount % e.ai.length];
    e.pending = e.moves[idx];
  });
}

/* ---------- 战斗胜利结算 ---------- */
function winCombat(){
  const kind = combat.kind;
  combat = null;
  if(kind==='boss'){
    afterBoss();
  } else if(kind==='elite'){
    offerBrother(()=>offerReward());
  } else {
    offerReward();
  }
}
function afterBoss(){
  if(run.chapter < 2){
    banner(CHAPTERS[run.chapter].no+' 完成！', ()=>{
      offerBrother(()=>{
        run.chapter++; run.node=0; run.nodes=genNodes(run.chapter);
        run.hp = Math.min(run.maxHp, run.hp + Math.round(run.maxHp*0.25)); // 章节间小幅恢复
        banner(CHAPTERS[run.chapter].no+' · '+CHAPTERS[run.chapter].name, ()=>{ showMap(); renderMapSafe(); });
      });
    }, 1600);
  } else {
    victory();
  }
}
function renderMapSafe(){ syncTopbar(); }

/* ---------- 兄弟救援 ---------- */
function offerBrother(cbAfter){
  const missing = BROTHERS.filter(b=>!run.brothers.includes(b.id));
  if(missing.length===0){
    /* 七子已全：葫芦籽奖励 */
    run.maxHp += 10; healPlayer(10);
    showStory('葫芦藤','洞中的葫芦藤已全部结出兄弟，\n藤上又生出一枚小小的葫芦籽。\n\n（生命上限 +10）',[{label:'继续', fn:cbAfter}]);
    return;
  }
  const options = shuffle(missing).slice(0,2);
  document.getElementById('ev-title').textContent = '兄弟被困在这里！';
  document.getElementById('ev-text').textContent = '妖洞深处传来熟悉的声音。砸开石牢——\n选择一位兄弟加入你的队伍：';
  const box = document.getElementById('ev-choices'); box.innerHTML='';
  const extra = document.getElementById('ev-extra'); extra.innerHTML=''; extra.style.display='none';
  const grid = document.createElement('div'); grid.className='bro-choice';
  options.forEach(b=>{
    const card = document.createElement('div'); card.className='char-card panel';
    card.style.borderColor = b.color;
    card.innerHTML = `
      <div class="char-avatar" style="background:${b.color}">${b.num}</div>
      <div class="char-name" style="color:${b.color}">${b.name}</div>
      <div class="char-passive">${b.passive}</div>
      <div class="char-sig">${b.sig.map(s=>'<span>'+CARDS[s].name+'</span>').join('')}</div>`;
    card.onclick = ()=>{
      SFX.transform();
      run.brothers.push(b.id);
      run.deck.push(...b.sig);
      checkQizi();
      showStory(b.name+' 加入了队伍！',
        '「'+b.name+'」挣脱枷锁，与你并肩而立！\n专属卡牌已加入卡组。'+(run.qizi?'\n\n🌈 七子连心，金刚葫芦娃降临！':''),
        [{label:'继续', fn:cbAfter}]);
    };
    grid.appendChild(card);
  });
  box.appendChild(grid);
  showScreen('screen-story');
}
function checkQizi(){
  if(run.brothers.length>=7 && !run.qizi){
    run.qizi = true;
    run.maxHp += 25; run.hp = run.maxHp;
    run.deck.push('qizi');
  }
}

/* ---------- 卡牌奖励 ---------- */
function offerReward(){
  const opts = shuffle(REWARD_POOL.slice()).slice(0,3);
  const grid = document.getElementById('reward-grid'); grid.innerHTML='';
  opts.forEach(cid=>{
    const el = makeCardEl(cid); el.classList.add('taken-target');
    el.onclick = ()=>{ run.deck.push(cid); SFX.card(); proceedAfterReward(); };
    grid.appendChild(el);
  });
  document.getElementById('btn-skip-reward').onclick = ()=>{ SFX.click(); proceedAfterReward(); };
  showScreen('screen-reward');
  syncTopbar();
}
function proceedAfterReward(){ completeNode(); }

/* =====================================================
   结局
   ===================================================== */
function gameOver(){
  SFX.lose();
  document.getElementById('end-title').textContent = '倒下了…';
  document.getElementById('end-title').style.color = '#c0392b';
  document.getElementById('end-sub').textContent = run.qizi
    ? '即使化作金刚葫芦娃，终究还是没能撑住……\n但兄弟们不会放弃，下一次一定救出爷爷！'
    : '「爷爷……对不起……」\n意识消散前，你仿佛看到了兄弟们的身影。';
  fillEndStats();
  showScreen('screen-end');
}
function victory(){
  SFX.transform();
  document.getElementById('end-title').textContent = '爷爷得救了！';
  document.getElementById('end-title').style.color = '#b8860b';
  document.getElementById('end-sub').textContent = run.qizi
    ? '金刚葫芦娃力挽狂澜，蛇精被收入宝葫芦，永世不得翻身！\n七子连心，其利断金——爷爷抚摸着你们的头，笑得无比欣慰。'
    : '蛇精仓皇逃窜，爷爷从石牢中被救了出来。\n虽然没能集齐七子，但团结的力量已足以守护正义！';
  fillEndStats();
  showScreen('screen-end');
}
function fillEndStats(){
  const box = document.getElementById('end-stats'); box.innerHTML='';
  [['击败妖精', run.stats.kills], ['打出卡牌', run.stats.cardsPlayed], ['经历回合', run.stats.turns], ['找到兄弟', run.brothers.length+'/7']]
  .forEach(([k,v])=>{ const c=document.createElement('span'); c.className='chip'; c.innerHTML=k+' <b>'+v+'</b>'; box.appendChild(c); });
}

/* =====================================================
   UI 渲染
   ===================================================== */
function makeCardEl(cid){
  const c = CARDS[cid];
  const el = document.createElement('div');
  el.className = 'card ' + c.type + (c.exhaust?' exhaust-mark':'');
  const accent = c.owner ? BROTHERS.find(b=>b.id===c.owner).color : (c.type==='attack'?'#c0392b':c.type==='skill'?'#2a9d8f':'#805ad5');
  el.innerHTML = `<div class="cost">${c.cost}</div><div class="cname">${c.name}</div>
    <div class="ctype">${c.type==='attack'?'攻击':c.type==='skill'?'技能':'能力'}</div>
    <div class="cdesc">${c.desc}</div><div class="cbar" style="background:${accent}"></div>`;
  return el;
}
function log(t){ document.getElementById('combat-log').textContent = t; }

function renderCombat(){
  if(!combat) return;
  /* 敌人 */
  const zone = document.getElementById('enemy-zone'); zone.innerHTML='';
  combat.enemies.forEach(e=>{
    const div = document.createElement('div');
    div.className = 'enemy' + (e.hp<=0?' dead':''); div.dataset.eid = e.id;
    let intentHtml = '';
    if(e.pending && e.hp>0){
      const mv = e.pending;
      if(mv.t==='atk'){
        const d = calcDmg(mv.v, e, {vuln:combat.playerVuln}, false);
        const n = (mv.hits||1) > 1 ? d+'×'+mv.hits : d;
        intentHtml = `<div class="intent atk">⚔️ ${n}</div>`;
      } else if(mv.t==='block') intentHtml = `<div class="intent def">🛡️ ${mv.v}</div>`;
      else if(mv.t==='buff') intentHtml = `<div class="intent buf">⬆️ 强化</div>`;
      else if(mv.t==='heal') intentHtml = `<div class="intent def">💧 吸血</div>`;
      else intentHtml = `<div class="intent deb">✨ 弱化</div>`;
    }
    const st = [];
    if(e.str>0) st.push(`<span class="status-tag str">力${e.str}</span>`);
    if(e.weak>0) st.push(`<span class="status-tag weak">弱${e.weak}</span>`);
    if(e.vuln>0) st.push(`<span class="status-tag vuln">易${e.vuln}</span>`);
    div.innerHTML = `${intentHtml}
      <div class="enemy-body">${e.emoji}</div>
      <div class="enemy-name">${e.name}</div>
      <div class="enemy-hp"><i style="width:${Math.max(0,e.hp/e.maxHp*100)}%"></i></div>
      <div class="enemy-sub"><span>${Math.max(0,e.hp)}/${e.maxHp}</span>
        ${e.block>0?`<span class="blk">🛡${e.block}</span>`:''}${st.join('')}</div>`;
    zone.appendChild(div);
  });
  /* 玩家状态 */
  const ps = document.getElementById('player-stats'); ps.innerHTML='';
  const chips = [];
  chips.push(`<span class="chip">❤ <b>${Math.max(0,Math.round(run.hp))}</b>/${run.maxHp}</span>`);
  if(combat.playerBlock>0) chips.push(`<span class="chip" style="color:#2a9d8f">🛡 格挡 <b>${combat.playerBlock}</b></span>`);
  chips.push('<span class="chip energy-orbs" style="background:none;padding:2px 0;">'+ Array.from({length:3},(_,i)=>`<i class="${i<run.energy?'full':''}"></i>`).join('') +'</span>');
  if(combat.playerStr>0) chips.push(`<span class="chip" style="color:#a3651a">力量 +${combat.playerStr}</span>`);
  if(combat.playerWeak>0) chips.push(`<span class="chip" style="color:#6b46a8">虚弱 ${combat.playerWeak}</span>`);
  if(combat.playerVuln>0) chips.push(`<span class="chip" style="color:#b03a2e">易伤 ${combat.playerVuln}</span>`);
  ps.innerHTML = chips.join('');
  /* 手牌 */
  const hand = document.getElementById('hand'); hand.innerHTML='';
  const n = combat.hand.length;
  combat.hand.forEach((cid,i)=>{
    const el = makeCardEl(cid);
    const mid = (n-1)/2, off = i-mid;
    el.style.transform = `translateY(${Math.abs(off)*7}px) rotate(${off*3}deg)`;
    el.style.zIndex = i;
    if(!canPlay(cid)) el.classList.add('disabled');
    el.onclick = ()=>playCard(i);
    el.title = '快捷键 ' + (i+1);
    hand.appendChild(el);
  });
  document.getElementById('draw-pile').textContent = '抽牌堆 '+combat.draw.length;
  document.getElementById('discard-pile').textContent = '弃牌堆 '+combat.discard.length;
  syncTopbar();
}

/* 飘字 */
function floatOn(sel, text, color){
  const host = document.querySelector(sel); if(!host) return;
  const f = document.createElement('span'); f.className='float-txt';
  f.textContent = text; f.style.color = color;
  f.style.left = '50%'; f.style.top = '10px'; f.style.transform='translateX(-50%)';
  host.style.position = 'relative';
  host.appendChild(f); setTimeout(()=>f.remove(), 1000);
}
function floatOnEnemy(e, text, color){
  const el = document.querySelector(`.enemy[data-eid="${e.id}"] .enemy-body`);
  if(!el) return;
  const f = document.createElement('span'); f.className='float-txt';
  f.textContent = text; f.style.color=color;
  f.style.left='50%'; f.style.top='18%'; f.style.transform='translateX(-50%)';
  el.appendChild(f); setTimeout(()=>f.remove(), 1000);
}
function bumpEnemy(e){
  const el = document.querySelector(`.enemy[data-eid="${e.id}"]`);
  if(!el) return;
  el.classList.add('hurt'); setTimeout(()=>el.classList.remove('hurt'), 180);
}

/* =====================================================
   入口与全局
   ===================================================== */
function init(){
  document.getElementById('title-ver').textContent = 'v'+VERSION;
  document.getElementById('tb-ver').textContent = 'v'+VERSION;
  const dots = document.getElementById('title-dots');
  BROTHERS.forEach(b=>{ const i=document.createElement('i'); i.style.background=b.color; dots.appendChild(i); });
  const grid = document.getElementById('char-grid');
  BROTHERS.forEach((b,i)=>{
    const card = document.createElement('div');
    card.className = 'char-card panel';
    card.innerHTML = `
      <div class="char-avatar" style="background:${b.color}">${b.num}</div>
      <div class="char-name" style="color:${b.color}">${b.name}</div>
      <div class="char-passive">${b.passive}</div>
      <div class="char-sig">${b.sig.map(s=>'<span>'+CARDS[s].name+'</span>').join('')}</div>`;
    card.onclick = ()=>{ SFX.ensure(); newRun(i); };
    grid.appendChild(card);
  });
  document.getElementById('btn-start').onclick = ()=>{ SFX.ensure(); SFX.click(); showScreen('screen-select'); };
  document.getElementById('btn-restart').onclick = ()=>location.reload();
  document.getElementById('btn-endturn').onclick = endTurn;
  document.getElementById('mute-btn').onclick = toggleMute;
  document.addEventListener('keydown', (ev)=>{
    if(ev.repeat) return;
    if(ev.key==='m'||ev.key==='M') toggleMute();
    if(document.getElementById('screen-combat').classList.contains('active')){
      if(ev.key>='1' && ev.key<='9'){ playCard(parseInt(ev.key)-1); }
      if(ev.key==='e'||ev.key==='E'||ev.key===' '){ ev.preventDefault(); endTurn(); }
    }
  });
}
function toggleMute(){
  SFX.muted = !SFX.muted;
  document.getElementById('mute-btn').textContent = SFX.muted ? '🔇' : '🔊';
}

/* 测试与调试钩子 */
window.GAME = {
  VERSION, get run(){ return run; }, get combat(){ return combat; },
  newRun, enterNode, playCard, endTurn, decideIntents, checkWin,
  BROTHERS, CARDS, ENEMIES, CHAPTERS,
  _cheat: {
    killEnemies(){ if(combat){ combat.enemies.forEach(e=>e.hp=0); checkWin(); } },
    godmode(){ if(run) run.hp = 999, run.maxHp = 999; },
    setHp(n){ if(run) run.hp = n; },
  }
};
init();
</script>
