<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>王国保卫战 - Kingdom Rush</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- Canvas will be resized dynamically to window size -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- Grid overlay will be centered dynamically -->
        <div id="grid-overlay"></div>

        <div id="ui-layer">
            <div id="menu-panel" class="panel active">
                <div style="position: absolute; bottom: 20px; right: 20px; color: rgba(255,255,255,0.3); font-size: 14px;">v6.0.0 (Borderless)</div>
                <h1 class="game-title">KINGDOM RUSH</h1>
                <h2 class="sub-title">王国保卫战：无界纪元</h2>
                <button id="btn-start" class="ui-btn primary">保卫王国</button>
            </div>

            <div id="hud-panel" class="panel">
                <div class="top-bar">
                    <div class="hud-box"><span class="icon">🏰 基地血量</span><span id="king-hp-text">20 / 20</span></div>
                    <div class="hud-box"><span class="icon">💰 金币</span><span id="hud-gold">500</span></div>
                    <div class="hud-box" style="display:flex; align-items:center; gap: 10px;">
                        <span class="icon">☠️</span><span>第 <span id="hud-wave">1</span> 波</span>
                        <button id="btn-call-wave" class="small-btn pulse" style="display:none;">提前召唤(+🪙)</button>
                        <button id="btn-speed" class="small-btn">▶️ 1x</button>
                    </div>
                </div>
                
                <div id="build-menu" class="bottom-bar" style="display: none; flex-wrap: wrap; justify-content: center; max-width: 600px;">
                    <div class="tower-card" data-type="ARCHER" title="物理单体速射"><div class="tower-icon">🏹</div><div class="tower-cost">70</div></div>
                    <div class="tower-card" data-type="MAGE" title="魔法穿甲单体"><div class="tower-icon">🔮</div><div class="tower-cost">100</div></div>
                    <div class="tower-card" data-type="ARTILLERY" title="物理群体溅射"><div class="tower-icon">💣</div><div class="tower-cost">125</div></div>
                    <div class="tower-card" data-type="ICE" title="魔法群体减速"><div class="tower-icon">❄️</div><div class="tower-cost">150</div></div>
                    <div class="tower-card" data-type="SNIPER" title="超远物理重击"><div class="tower-icon">🎯</div><div class="tower-cost">180</div></div>
                    <div class="tower-card" data-type="POISON" title="魔法群体持续毒伤"><div class="tower-icon">🍄</div><div class="tower-cost">140</div></div>
                </div>

                <div id="upgrade-menu">
                    <div id="upg-title" style="color: #d4af37; font-size: 14px; text-align: center; margin-bottom: 5px; font-weight: bold;"></div>
                    <div id="upg-stats" style="color: #bdc3c7; font-size: 12px; margin-bottom: 8px; text-align: left; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 3px;"></div>
                    <button id="btn-upgrade" class="upg-btn" style="margin-bottom: 4px;">升级 (100)</button>
                    <button id="btn-sell" class="upg-btn">出售 (50)</button>
                </div>
            </div>

            <div id="gameover-panel" class="panel">
                <h1 class="game-title text-danger" id="end-title">王国陨落</h1>
                <h2 class="sub-title" id="end-desc">抵挡到了第 1 波</h2>
                <button id="btn-restart" class="ui-btn primary">重新集结</button>
            </div>
            <div id="tooltip" style="display:none; position:absolute; background:rgba(0,0,0,0.9); border: 2px solid #d4af37; padding: 10px; border-radius:5px; color:#fff; pointer-events:none; z-index:1000; font-size:14px; white-space:nowrap; box-shadow: 0 5px 15px rgba(0,0,0,0.5);"></div>
        </div>
    </div>
    
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
