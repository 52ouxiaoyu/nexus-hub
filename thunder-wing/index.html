<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>雷霆之翼 Thunder Wing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="480" height="800"></canvas>

  <div id="hud-top">
    <span class="tag">雷霆之翼</span>
    <span id="ver" class="ver">v1.0.1</span>
  </div>

  <button id="btn-bomb" title="炸弹">B</button>

  <!-- 主菜单 -->
  <div id="ov-menu" class="overlay">
    <div class="panel">
      <div class="logo">雷霆之翼</div>
      <div class="logo-en">T H U N D E R &nbsp; W I N G</div>
      <div id="menu-best" class="best">最高分 0</div>
      <div class="btns">
        <button class="btn primary" data-act="start-story">故事模式 <span>5 关闯关</span></button>
        <button class="btn" data-act="start-endless">无尽模式 <span>越打越难</span></button>
      </div>
      <div class="help">
        <div class="row"><b>WASD / 方向键</b><span>移动</span></div>
        <div class="row"><b>J / 空格</b><span>射击（按住 0.8 秒自动蓄力炮）</span></div>
        <div class="row"><b>K / X</b><span>炸弹（清屏 + 无敌）</span></div>
        <div class="row"><b>Shift</b><span>低速微调（显示判定点）</span></div>
        <div class="row"><b>P / Esc</b><span>暂停</span></div>
        <div class="row touch-only"><b>触屏</b><span>拖动移动 · 自动射击 · 右下 B 放炸弹</span></div>
      </div>
      <div class="tips">擦着敌弹飞过可加分，连击不断倍率最高 x4.00</div>
      <div class="foot">程序化矢量美术 · 无外部素材 · <span id="menu-ver">v1.0.1</span></div>
      <button class="btn small" data-act="mute">♪ 开启</button>
    </div>
  </div>

  <!-- 暂停 -->
  <div id="ov-pause" class="overlay hidden">
    <div class="panel small-panel">
      <div class="ttl">已暂停</div>
      <div class="btns">
        <button class="btn primary" data-act="resume">继续</button>
        <button class="btn" data-act="restart">重新开始</button>
        <button class="btn" data-act="menu">返回菜单</button>
      </div>
    </div>
  </div>

  <!-- 结算 -->
  <div id="ov-result" class="overlay hidden">
    <div class="panel small-panel">
      <div id="res-title" class="ttl">任务失败</div>
      <div class="score-line">得分 <span id="res-score">0</span></div>
      <div id="res-detail" class="detail"></div>
      <div class="btns">
        <button class="btn primary" data-act="restart">再来一次</button>
        <button class="btn" data-act="menu">返回菜单</button>
      </div>
    </div>
  </div>
</div>

<script src="sprites.js"></script>
<script src="fx.js"></script>
<script src="enemies.js"></script>
<script src="game.js"></script>
</body>
</html>
