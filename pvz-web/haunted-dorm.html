<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>植物大战僵尸：守屋大作战（大地图）</title>
        <link rel="stylesheet" href="css/haunted-dorm.css?v=1792591417">
</head>
<body class="dorm-page">
<div id="dorm-screen">
<div id="dorm-container">
        <!-- 视角 -->
        <div id="vp1" class="viewport">
            <div id="world1" class="world"></div>
        </div>

        <!-- 全局 UI -->
        <div id="dorm-ui">
            <div id="hud-p1" class="player-hud">
                <div class="hud-ctrl" style="color:#4da6ff;">
                    <div>【P1 控制】移动: W/A/S/D ｜ 建造/确认: F或J</div>
                    <div>浇水: 空格 ｜ 取消: 右Alt或G ｜ 技能: M</div>
                </div>
                <div style="display:flex; gap:18px; align-items:center;">
                    <span>阳光: <span id="sun1" class="sun-text">0</span></span>
                    <span>孢子: <span id="spore1" class="sun-text" style="color:#c79aff;">0</span></span>
                    <span style="color:#ff9e9e;">⚔伤害: <span id="dmg1" class="sun-text">0</span></span>
                </div>
                <div id="hp-row" class="hp-row">
                    <span class="hp-label">HP</span>
                    <div id="hp-track" class="hp-track"><div id="hp-fill" class="hp-fill"></div></div>
                    <span id="hp-num" class="hp-label">100</span>
                </div>
                <div id="skill-hud" style="margin-top: 8px; font-size: 14px;"></div>
            </div>

            <div id="speed-hud" style="position: absolute; top: 88px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; background: rgba(0,0,0,0.8); border: 2px solid #aaa; border-radius: 20px; padding: 3px 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: auto; z-index: 45;">
                <span style="color:#fff; margin-right: 8px; font-weight: bold; font-size: 13px; text-shadow: 0 1px 2px #000;">🕒 倍速</span>
                <div style="display: flex; gap: 4px;">
                    <button class="speed-btn active" onclick="window.game.setTimeScale(1)">1x</button>
                    <button class="speed-btn" onclick="window.game.setTimeScale(2)">2x</button>
                    <button class="speed-btn" onclick="window.game.setTimeScale(5)">5x</button>
                    <button class="speed-btn" onclick="window.game.setTimeScale(10)">10x</button>
                </div>
            </div>

            <div id="p2-hud" class="player-hud" style="display:none; right:20px; left:auto; text-align: right;">
                <div class="hud-ctrl" style="color:#4fc3f7;">
                    <div>【P2 控制】移动: 方向键 ｜ 建造/确认: 1</div>
                    <div>浇水: 0 ｜ 取消: 2或回车 ｜ 技能: 3或/键</div>
                </div>
                <div style="display:flex; gap:18px; align-items:center; justify-content: flex-end;">
                    <span>阳光: <span id="sun2" class="sun-text">0</span></span>
                    <span>孢子: <span id="spore2" class="sun-text" style="color:#c79aff;">0</span></span>
                    <span style="color:#ff9e9e;">⚔伤害: <span id="dmg2" class="sun-text">0</span></span>
                </div>
                <div id="hp-row2" class="hp-row" style="justify-content: flex-end;">
                    <span id="hp-num2" class="hp-label">100</span>
                    <div id="hp-track2" class="hp-track"><div id="hp-fill2" class="hp-fill"></div></div>
                    <span class="hp-label">HP</span>
                </div>
                <div id="skill-hud2" style="margin-top: 8px; font-size: 14px;"></div>
            </div>

            <div id="wave-chip">👻 准备中…</div>
            <!-- v4.0.17：实时伤害榜——MVP 不再是结算时才揭晓的意外 -->
            <div id="dmg-board" style="display:none;"></div>

            <canvas id="minimap" width="320" height="240"></canvas>
            
            <div style="position: absolute; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 12px; pointer-events: none;">
                <!-- v4.0.53：取消对局内游玩说明（玩法说明统一在主菜单「操作与道具说明」） -->
                <button class="back-btn" style="position: static; pointer-events: auto;" onclick="location.href='index.html'">返回主菜单</button>
            </div>

            <!-- 种植菜单（选项由 HauntedDorm.js 按图鉴数据生成） -->
            <div id="plant-menu"></div>

            <!-- v3.88.0 点击植物 → 升级/拆除弹窗 -->
            <div id="plant-popup">
                <div id="pp-title">植物</div>
                <div id="pp-feed" style="display:none;"></div>
                <div class="pp-btns">
                    <button id="pp-demolish" class="pp-btn">拆除</button>
                    <button id="pp-upgrade" class="pp-btn">升级 🦠0</button>
                </div>
            </div>
        </div>

        <div id="dmg-flash"></div>

        <!-- 胜负结算 -->
        <div id="dorm-over">
            <div class="ov-title" id="ov-title">你活下来了！</div>
            <div class="ov-stats">
                <div class="ov-stat">坚持时间<b id="ov-time">0:00</b></div>

                <div class="ov-stat">僵尸等级<b id="ov-waves">0</b></div>
                <div class="ov-stat">本局MVP<b id="ov-mvp">你</b></div>
            </div>
            <div class="ov-btns">
                <button class="ov-btn" id="ov-retry" onclick="window.retryDormGame ? window.retryDormGame() : location.reload()">再来一局</button>
                <button class="ov-btn" id="ov-home" onclick="window.exitDormGame ? window.exitDormGame() : location.href='index.html'">返回主菜单</button>
            </div>
        </div>
    </div>

    <script src="js/Achievements.js?v=1792591417"></script>
    <script src="js/HauntedDorm.js?v=1792591417"></script>
</div>
</body>
</html>
