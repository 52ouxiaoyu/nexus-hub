<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plants vs Zombies - Web Clone</title>
    <link rel="stylesheet" href="css/style.css?v=1788082898">
</head>
<body>
    <div id="game-container">
        <div id="background-layer"></div>
        <div id="entity-layer"></div>
        
        <!-- UI Layer -->
        <div id="ui-layer">
            <div id="top-bar" style="width: 100%; display: flex; flex-wrap: nowrap; align-items: flex-start;">
                <div id="sun-bank">
                    <span id="sun-count">50</span>
                </div>
                <div id="seed-bank"></div>
                
                <div id="shovel-bank">
                    <div id="shovel" class="tool-card" title="铲子"></div>
                </div>
                
                <div id="glove-bank" style="width: 70px; height: 72px; margin-left: 10px; background: rgba(0,0,0,0.5); border: 2px solid #a65; border-radius: 10px; display: none; cursor: pointer; justify-content: center; align-items: center; box-sizing: border-box;">
                    <div style="font-size: 36px; line-height: 72px;">🧤</div>
                </div>
                
                <div id="recipe-book-btn" style="width: 70px; height: 72px; margin-left: 10px; background: rgba(0,0,0,0.5); border: 2px solid #a65; border-radius: 10px; display: none; cursor: pointer; justify-content: center; align-items: center; box-sizing: border-box;" title="融合图鉴">
                    <div style="font-size: 36px; line-height: 72px;">📖</div>
                </div>
                <div id="score-bank" style="margin-left: auto; background-color: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; color: white; font-family: monospace; font-size: 20px; display: flex; align-items: center; border: 2px solid #8b5a2b; height: 34px;">
                    Score: <span id="score-count" style="margin-left: 10px; font-weight: bold; color: #ffd700;">0</span>
                </div>
                <div id="version-bank" title="当前游戏版本（变更后请刷新页面）" style="margin-left: 10px; background-color: rgba(0,80,40,0.7); padding: 5px 12px; border-radius: 20px; color: #bdf; font-family: monospace; font-size: 14px; display: flex; align-items: center; border: 2px solid #4a8; height: 34px; cursor: help;">
                    🏷️ <span id="version-display" style="margin-left: 6px; font-weight: bold;">v?.?.?</span>
                </div>
                <button id="btn-speed" style="margin-left: 15px; padding: 5px 15px; border-radius: 20px; font-family: monospace; font-size: 18px; font-weight: bold; background: rgba(0,0,0,0.5); color: #fff; border: 2px solid #8b5a2b; cursor: pointer; text-shadow: 1px 1px 2px black;">Speed: 1x</button>
            </div>
        <!-- Recipe Modal -->
        <div id="recipe-modal" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 500px; background: #c69c6d; border: 4px solid #4a3018; border-radius: 10px; z-index: 3000; padding: 20px; box-shadow: 0 0 20px #000; pointer-events: auto;">
            <h2 style="text-align: center; color: #fff; text-shadow: 2px 2px 0 #000; margin-top: 0;">融合配方大全</h2>
            <ul id="recipe-list" style="list-style: none; padding: 0; max-height: 300px; overflow-y: auto; background: #fff; border: 2px inset #000; padding: 10px; color: #000;">
            </ul>
            <div style="text-align: center; margin-top: 15px;">
                <button id="close-recipe" style="padding: 5px 20px; font-weight: bold; cursor: pointer;">关闭</button>
            </div>
        </div>
            <div id="drag-ghost" style="display: none;"></div>
        </div>
        
        <!-- Seed Chooser UI -->
        <div id="seed-chooser" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 1500; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div style="background-color: #6b4a2b; padding: 25px; border-radius: 15px; border: 4px solid #3c2a11; box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.8); width: 650px;">
                <h2 style="color: #f5deb3; text-align: center; margin-bottom: 15px; text-shadow: 2px 2px 2px black; font-family: monospace; font-size: 24px;">Choose Your Plants (<span id="chooser-count">0</span>/10)</h2>
                <div id="chooser-grid" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 25px; max-height: 350px; overflow-y: auto; background-color: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; box-shadow: inset 0 0 10px black;">
                    <!-- Seeds will be injected here -->
                </div>
                <div style="display: flex; justify-content: center; gap: 20px;">
                    <button id="btn-back" style="background-image: url('assets/images/interface/ShovelBack.png'); background-size: 100% 100%; border: none; padding: 10px 30px; font-size: 18px; font-family: monospace; font-weight: bold; color: white; cursor: pointer; border-radius: 10px; text-shadow: 1px 1px 2px black;">Return</button>
                    <button id="btn-lets-rock" style="background-image: url('assets/images/interface/ShovelBack.png'); background-size: 100% 100%; border: none; padding: 10px 40px; font-size: 20px; font-family: monospace; font-weight: bold; color: white; cursor: pointer; border-radius: 10px; opacity: 0.5; text-shadow: 1px 1px 2px black;" disabled>Let's Rock!</button>
                </div>
            </div>
        </div>

        <!-- Start Menu -->
        <div id="start-menu" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 2000; transition: transform 0.2s;">
            <img src="assets/images/interface/Logo.png" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none;">
            <div id="start-version" style="position: absolute; bottom: 10px; right: 15px; color: rgba(255,255,255,0.7); font-size: 14px; font-family: monospace; z-index: 2001; text-shadow: 1px 1px 2px black;">加载版本号...</div>
            
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 20px; z-index: 2002;">
                <button id="btn-adventure" style="background-color: #4CAF50; border: 4px solid #2E7D32; color: white; padding: 15px 40px; font-size: 28px; font-family: monospace; font-weight: bold; border-radius: 30px; cursor: pointer; text-shadow: 2px 2px 4px #000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: transform 0.1s;">经典冒险模式</button>
                <button id="btn-fusion" style="background-color: #9C27B0; border: 4px solid #6A1B9A; color: white; padding: 15px 40px; font-size: 28px; font-family: monospace; font-weight: bold; border-radius: 30px; cursor: pointer; text-shadow: 2px 2px 4px #000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: transform 0.1s;">🔬 融合进化版 🧬</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        document.getElementById('btn-adventure').onmouseover = function() { this.style.transform = 'scale(1.05)'; };
        document.getElementById('btn-adventure').onmouseout = function() { this.style.transform = 'scale(1)'; };
        document.getElementById('btn-fusion').onmouseover = function() { this.style.transform = 'scale(1.05)'; };
        document.getElementById('btn-fusion').onmouseout = function() { this.style.transform = 'scale(1)'; };
        
        function resizeGame() {
            const container = document.getElementById('game-container');
            const scaleX = window.innerWidth / 900;
            const scaleY = window.innerHeight / 600;
            const scale = Math.min(scaleX, scaleY);
            container.style.transform = `scale(${scale})`;
            container.style.transformOrigin = 'center center';
            // Store scale for InputManager
            window.gameScale = scale;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        // ===== 加载版本号（用户用以判断是否运行最新代码）=====
        (function loadVersion() {
            const el = document.getElementById('version-display');
            if (!el) return;
            fetch('version.json?t=' + Date.now())
                .then(r => r.ok ? r.json() : null)
                .then(v => {
                    if (v && v.version) {
                        el.textContent = v.version + ' (build ' + (v.build || '?') + ')';
                        el.title = (v.feature || '') + '\nasset version: ' + (v.assetVersion || '?');
                        // 同步更新开始菜单左下角的版本号，避免两处不一致
                        const sv = document.getElementById('start-version');
                        if (sv) sv.textContent = v.version + ' (build ' + (v.build || '?') + ')';
                    } else {
                        el.textContent = 'no version.json';
                    }
                })
                .catch(err => {
                    el.textContent = 'load err';
                    console.warn('version.json load failed:', err);
                });
        })();
    </script>
    <script src="js/InputManager.js?v=1788082898"></script>
    <script src="js/Board.js?v=1788082898"></script>
    <script src="js/entities/Entity.js?v=1788082898"></script>
    <script src="js/entities/Plant.js?v=1788082898"></script>
    <script src="js/entities/Zombie.js?v=1788082898"></script>
    <script src="js/entities/Projectile.js?v=1788082898"></script>
    <script src="js/entities/Sun.js?v=1788082898"></script>
    <script src="js/managers/WaveManager.js?v=1788082898"></script>
    <script src="js/managers/CollisionManager.js?v=1788082898"></script>
    <script src="js/managers/EventManager.js?v=1788082898"></script>
    <script src="js/GameLoop.js?v=1788082898"></script>
</body>
</html>
