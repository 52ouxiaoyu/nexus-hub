<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plants vs Zombies - Web Clone</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <div id="background-layer"></div>
        <div id="entity-layer"></div>
        
        <!-- UI Layer -->
        <div id="ui-layer">
            <div id="top-bar">
                <div id="sun-bank">
                    <span id="sun-count">50</span>
                </div>
                <div id="seed-bank"></div>
                <div id="shovel-bank">
                    <div id="shovel" class="tool-card"></div>
                </div>
                <div id="score-bank" style="margin-left: auto; background-color: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; color: white; font-family: monospace; font-size: 20px; display: flex; align-items: center; border: 2px solid #8b5a2b; height: 34px;">
                    Score: <span id="score-count" style="margin-left: 10px; font-weight: bold; color: #ffd700;">0</span>
                </div>
            </div>
            <div id="drag-ghost" style="display: none;"></div>
        </div>
        <!-- Start Menu -->
        <div id="start-menu" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); z-index: 2000; cursor: pointer; transition: transform 0.2s;">
            <img src="assets/images/interface/Logo.png" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none;">
            <div style="position: absolute; bottom: 10px; right: 15px; color: rgba(255,255,255,0.7); font-size: 14px; font-family: monospace; z-index: 2001; text-shadow: 1px 1px 2px black;">v1.1.0 (Build 2608)</div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        document.getElementById('start-menu').onmouseover = function() { this.style.transform = 'scale(1.02)'; };
        document.getElementById('start-menu').onmouseout = function() { this.style.transform = 'scale(1)'; };
        
        function resizeGame() {
            const container = document.getElementById('game-container');
            const scaleX = window.innerWidth / 900;
            const scaleY = window.innerHeight / 600;
            const scale = Math.min(scaleX, scaleY);
            container.style.transform = `scale(${scale})`;
            container.style.transformOrigin = 'center center';
            // Store scale for InputManager
            window.gameScale = scale;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();
    </script>
    <script src="js/InputManager.js"></script>
    <script src="js/Board.js"></script>
    <script src="js/entities/Entity.js"></script>
    <script src="js/entities/Plant.js"></script>
    <script src="js/entities/Zombie.js"></script>
    <script src="js/entities/Projectile.js"></script>
    <script src="js/entities/Sun.js"></script>
    <script src="js/managers/WaveManager.js"></script>
    <script src="js/managers/CollisionManager.js"></script>
    <script src="js/GameLoop.js"></script>
</body>
</html>
