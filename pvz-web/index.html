    <!-- Scripts -->
    <script>
        function resizeGame() {
            const container = document.getElementById('game-container');
            const scaleX = window.innerWidth / 900;
            const scaleY = window.innerHeight / 600;
            const scale = Math.min(scaleX, scaleY);
            container.style.transform = `scale(${scale})`;
            container.style.transformOrigin = 'center center';
            // Store scale for InputManager
            window.gameScale = scale;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        // ===== 加载版本号：仅开始菜单左下角展示（游戏内 HUD 不再显示）=====
        (function loadVersion() {
            const sv = document.getElementById('start-version');
            const el = document.getElementById('version-display'); // 兼容旧引用（游戏中徽标已移除，恒为 null）
            if (!sv && !el) return;
            fetch('version.json?t=' + Date.now())
                .then(r => r.ok ? r.json() : null)
                .then(v => {
                    if (v && v.version) {
                        const label = v.version + ' (build ' + (v.build || '?') + ')';
                        if (sv) sv.textContent = label;
                        if (el) { el.textContent = label; el.title = (v.feature || '') + '\nasset version: ' + (v.assetVersion || '?'); }
                    } else if (sv) {
                        sv.textContent = 'no version.json';
                    }
                })
                .catch(err => {
                    if (sv) sv.textContent = 'load err';
                    console.warn('version.json load failed:', err);
                });
        })();
    </script>
